# ================================================================
# 명함보관함 APK 자동 빌드
#  - android/ 폴더가 바뀌면 APK를 빌드해 GitHub Releases에 올림
#  - 빌드 로그(+APK)는 ci-logs 브랜치에도 남김(원격 점검용)
#  - 고정 서명키: 저장소 Secrets에 SIGNING_KEYSTORE_B64 / SIGNING_STORE_PASSWORD /
#    SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD 를 넣으면 자동 사용
# ================================================================
name: Android APK

on:
  push:
    branches: [main, feat/scan-mode]          # 빌드 대상 브랜치
    paths:
      - 'android/**'                          # 안드로이드 코드 변경 시
      - '.github/workflows/android-apk.yml'   # 워크플로 변경 시
  workflow_dispatch: {}                       # 수동 실행 허용

permissions:
  contents: write                             # 릴리스·로그 브랜치 쓰기

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5             # 소스 받기

      - uses: actions/setup-java@v5           # JDK 17
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4  # Gradle 8.9 (AGP 8.6 호환)
        with:
          gradle-version: '8.9'

      - name: 서명키 준비 (Secrets 있을 때만)
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "고정 서명키 사용"
          else
            echo "Secrets 없음 → 디버그 키로 서명"
          fi

      - name: APK 빌드
        id: build
        continue-on-error: true
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle -p android assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: 결과 정리
        id: collect
        run: |
          mkdir -p out
          cp build.log out/build.log
          APK=$(ls android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || true)
          VER=$(grep -m1 "versionName" android/app/build.gradle | sed -E "s/.*'([^']+)'.*/\1/")
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if [ -n "$APK" ]; then
            cp "$APK" "out/BusinessCards-$VER.apk"
            echo "apk=out/BusinessCards-$VER.apk" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "run=${{ github.run_number }}"
            echo "sha=${{ github.sha }}"
            echo "branch=${{ github.ref_name }}"
            echo "outcome=${{ steps.build.outcome }}"
          } > out/info.txt
          ls -la out

      - name: 로그를 ci-logs 브랜치에 게시
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "CI #${{ github.run_number }} (${{ steps.build.outcome }})"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:ci-logs

      - name: 릴리스에 APK 업로드
        if: steps.collect.outputs.apk != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-v${{ steps.collect.outputs.ver }}-${{ github.run_number }}"
          gh release create "$TAG" "${{ steps.collect.outputs.apk }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "명함보관함 ${{ steps.collect.outputs.ver }} (빌드 #${{ github.run_number }})" \
            --notes "스캔 모드(구글 문서 스캐너) + 기기 내 한글 OCR 탑재 APK. 브랜치: ${{ github.ref_name }}"

      - name: 빌드 실패 시 작업 실패 처리
        if: steps.build.outcome != 'success'
        run: exit 1
