  company:/(㈜|\(주\)|\(유\)|주식회사|유한회사|유한책임회사|그룹|코퍼레이션|케미칼|케미컬|화학|석유|정유|산업|전자|건설|무역|상사|물산|홀딩스|해운|물류|로지스틱스|은행|증권|보험|Co\.?,?\s*Ltd\.?|Ltd\.?|Limited|Inc\.?|Corp\.?|Corporation|Company|Group|Holdings|LLC|GmbH|S\.A\.|PLC|Pte\.?|株式会社|有限会社|\(株\)|集团|有限公司)/i,
  dept:/(본부|사업부|사업팀|부문|팀|실|센터|연구소|지점|지사|사무소|공장|Division|Dept\.?|Department|Team|Office|Unit|Group|事業部|部|課|室)/i,
  addr:/(특별시|광역시|특별자치|[가-힣]{1,4}도\s|[가-힣]{1,5}[시군구]\s|[가-힣\d]{1,8}(로|길|대로)\s*\d|[가-힣]{1,4}동\s*\d|번길|빌딩|타워|센터\s?\d|\d+층|Street|St\.|Road|Rd\.|Avenue|Ave\.?|Blvd|Pkwy|Parkway|Drive|Dr\.|Lane|Highway|Hwy|Plaza|USA|U\.S\.A|\b[A-Z]{2}\s\d{5}\b|Germany|Taiwan|Hong Kong|Thailand|Vietnam|India|Building|Bldg\.?|Tower|Floor|\d+F\b|Suite|Seoul|Busan|Ulsan|Yeosu|Daesan|Incheon|Tokyo|Osaka|Shanghai|Singapore|Korea|Japan|China|都|道|府|県|区|丁目|番地|〒)/i
};
function extractFields(text, lines){
  const out = {};
  // 1) 줄 목록 정리 (위치·글자 높이가 있으면 함께)
  let L = (lines && lines.length) ? lines.map(l=>({ t:String(l.text||'').trim(), h:l.h||0, y:l.y||0 }))
                                  : text.split(/\n+/).map((t,i)=>({ t:t.trim(), h:0, y:i }));
  L = L.filter(l=>l.t.length > 0);
  const used = new Set();                                                        // 이미 쓴 줄

  // 2) 이메일 / 웹사이트
  for (const l of L){ const m = l.t.match(RX.email); if (m){ out.email = m[0].replace(/\s/g,''); used.add(l); break; } }
  for (const l of L){
    if (RX.email.test(l.t)) continue;
    const m = l.t.match(RX.url);
    if (m){ out.website = /^https?:/i.test(m[0]) ? m[0] : 'https://' + m[0].replace(/^www\./i,'www.'); used.add(l); break; }
  }

  // 3) 전화 / 휴대폰 / 팩스 (한 줄에 여러 번호와 라벨 처리)
  const phones = {mobile:[], tel:[], fax:[]}, seen = new Set();
  const numRe = /\+?\(?\d[\d\s().\-–—]{6,}\d/g;                                 // 국가번호·(0) 포함 번호 덩어리
  for (const l of L){
    let m; numRe.lastIndex = 0;
    while ((m = numRe.exec(l.t))){
      const raw = m[0].trim();
      if (/^\d{4}[.\-\/]\d{1,2}[.\-\/]\d{1,2}$/.test(raw)) continue;               // 날짜 제외
      let num = raw.replace(/[–—]/g,'-').replace(/\s*-\s*/g,'-').replace(/\s{2,}/g,' ');
      if (/^\+/.test(num)) num = num.replace(/\(\s*0\s*\)\s*-?\s*/,'').replace(/-{2,}/g,'-'); // +81-(0)3 → +81-3
      const digits = num.replace(/\D/g,'');
      if (digits.length < 8 || digits.length > 14) continue;                     // 우편번호·여러 번호 붙음 제외
      if (seen.has(digits)) continue; seen.add(digits);
      const label = l.t.slice(Math.max(0, m.index - 12), m.index);               // 번호 앞 라벨
      const d2 = digits.replace(/^0{0,2}82/, '0').replace(/^00/, '');            // +82 → 0 기준 판단
      if (/(fax|팩스|F\s*[:.)]?\s*$|传真|ＦＡＸ)/i.test(label)) phones.fax.push(num);
      else if (/(mobile|mob|cell|휴대|핸드폰|H\.?\s?P|M\s*[:.)]?\s*$|C\s*[:.)]?\s*$|携帯|手机)/i.test(label) || /^01[016789]/.test(d2) || /^(\+?81)?0?[789]0\d{8}$/.test(digits)) phones.mobile.push(num);
      else phones.tel.push(num);
      used.add(l);
    }
  }
  if (phones.mobile[0]) out.mobile = phones.mobile[0];
  if (phones.tel[0]) out.tel = phones.tel[0];
  if (phones.fax[0]) out.fax = phones.fax[0];

  // 4) 주소 (연속된 주소 줄 합치기) + 우편번호
  const addrIdx = [];
  L.forEach((l,i)=>{ if (!used.has(l) && RX.addr.test(l.t) && !RX.email.test(l.t) && l.t.length > 6) addrIdx.push(i); });
  if (addrIdx.length){
    const first = addrIdx[0], group = [first];
    for (let k=1;k<addrIdx.length;k++){ if (addrIdx[k] === group[group.length-1] + 1 && group.length < 3) group.push(addrIdx[k]); }
    let addr = group.map(i=>L[i].t).join(' ');
    group.forEach(i=>used.add(L[i]));
    const ZIPS = [/〒\s*\d{3}-?\d{4}/, /\(\s*\d{5}\s*\)/, /(?<![\d\-])\d{3}-\d{4}(?![\d\-])/,   // 〒, (12345), 일본 100-0006
                  /(?<![\d\-])\d{5}(?:-\d{4})?(?![\d\-])/, /(?<![\d\-])\d{6}(?![\d\-])/];   // 한국·미국 5자리, 중국 6자리
    for (const zr of ZIPS){
      const zip = addr.match(zr);
      if (zip){ out.addressDetail = zip[0].replace(/[〒()\s]/g,''); addr = addr.replace(zip[0], ' '); break; }
    }
    out.address = addr.replace(/^(주소|address|addr\.?|add\.?)\s*[:.]?\s*/i,'')
      .replace(/\s+([,.])/g,'$1').replace(/,\s*,/g,',').replace(/\s{2,}/g,' ').trim().replace(/^[,\s]+|[,\s]+$/g,'');
  }

  // 5) 회사명 (회사 키워드 줄, 글자 큰 것 우선)
  const compCands = L.filter(l=>!used.has(l) && RX.company.test(l.t) && l.t.length <= 40);
  if (compCands.length){
    compCands.sort((a,b)=>(b.h - a.h) || (a.t.length - b.t.length));
    out.company = compCands[0].t.replace(/\s{2,}/g,' ');
    used.add(compCands[0]);
  }

  // 6) 이름 + 직함 (같은 줄에 붙어 있는 경우 분리)
  const nameCands = [];
  for (const l of L){
    if (used.has(l)) continue;
    let t = l.t.replace(/[|·•]/g,' ').replace(/\s{2,}/g,' ').trim();
    let title = null;
    const tm = t.match(RX.title);
    if (tm){ title = tm[0]; t = t.replace(tm[0], '').trim(); }
    if (!t) { if (title && !out.title){ out.title = l.t.trim(); used.add(l); } continue; }
    const hangul = t.replace(/\s/g,'');
    let score = 0, name = null, kind = null;
    if (/^[가-힣]{2,4}$/.test(hangul) && !RX.company.test(t) && !/(본부|부문|팀|실|센터|연구소|지점|지사|공장|사무소|그룹)$/.test(hangul)){ /* 한글 이름(부서명 제외) */ name = hangul; kind = 'ko'; score = 3; }
    else if (/^[一-鿿]{1,3}\s?[一-鿿]{1,3}$/.test(t) && t.replace(/\s/g,'').length <= 5 && !RX.company.test(t) && !/[部課室所社局]$/.test(t)){ /* 한자/일본 이름(부서 제외) */ name = t; kind = 'cjk'; score = 2.4; }
    else if (/^[A-Z][a-zA-Z'\-]+(\s+[A-Z][a-zA-Z'\-.]*){1,2}$/.test(t) && !RX.company.test(t) && !RX.title.test(t) && t.length <= 30){ name = t; kind = 'en'; score = 2; }
    else if (/^[A-Z]{2,}(\s+[A-Z]{2,}){1,2}$/.test(t) && t.length <= 28 && !RX.company.test(t)){ name = t.replace(/\b([A-Z])([A-Z]+)\b/g,(a,b,c)=>b+c.toLowerCase()); kind = 'en'; score = 1.6; }
    if (!name) continue;
    if (title) score += 1.2;                                                     // 직함이 붙어 있으면 이름일 확률↑
    score += l.h ? l.h / 20 : 0;                                                 // 글자가 클수록 이름일 확률↑
    nameCands.push({ l, name, title, kind, score });
  }
  nameCands.sort((a,b)=>b.score - a.score);
  if (nameCands.length){
    const top = nameCands[0];
    out.name = top.name; used.add(top.l);
    if (top.title && !out.title) out.title = top.title;
    const sub = nameCands.find(c=>c !== top && c.kind !== top.kind);              // 다른 표기(한자/영문) = 보조 이름
    if (sub){ out.nameSub = sub.name; used.add(sub.l); }
  }

  // 7) 직함 (아직 없으면 직함 키워드 줄)
  if (!out.title){
    const tl = L.find(l=>!used.has(l) && RX.title.test(l.t) && l.t.length <= 50);
    if (tl){
      const parts = tl.t.split(/\s*[\/|,·]\s*/).filter(Boolean);                // "Senior Manager / Procurement Team" 분리
      const tp = parts.find(x=>RX.title.test(x)) || tl.t;
      out.title = tp.trim();
      const dp = parts.find(x=>x !== tp && RX.dept.test(x));
      if (dp && !out.companySub) out.companySub = dp.trim();
      used.add(tl);
    }
  }
  // 8) 부서
  if (!out.companySub){                                                          // 부서 줄 최대 3개를 이어 붙임
    const dls = L.filter(l=>!used.has(l) && RX.dept.test(l.t) && !RX.company.test(l.t) && l.t.length <= 45 && !/\d{3,}/.test(l.t)).slice(0,3);
    if (dls.length){
      out.companySub = dls.map(l=>out.title && l.t.includes(out.title) ? l.t.replace(out.title,'').trim() : l.t).filter(Boolean).join(' · ');
      dls.forEach(l=>used.add(l));
    }
  }
  // 9) 회사가 없으면 가장 큰 남은 줄(영문 대문자 로고 등)
  if (!out.company){
    const rest = L.filter(l=>!used.has(l) && l.t.length >= 2 && l.t.length <= 30 && !/\d{3,}/.test(l.t));
    if (rest.length && rest[0].h){ rest.sort((a,b)=>b.h-a.h); out.company = rest[0].t; }
  }
  Object.keys(out).forEach(k=>{ if (!out[k]) delete out[k]; });
  return out;
}

/* =========================================================
   N. AI 인식 (선택: Gemini / OpenAI)
   ========================================================= */
const AI_PROMPT = `You are a business card reader. Read the business card image and extract its information.
Return ONLY a JSON object (no markdown, no commentary) with these keys; use null for anything not present:
{"name": string, "nameSub": string, "title": string, "company": string, "companySub": string, "mobile": string, "tel": string, "fax": string, "email": string, "website": string, "address": string, "addressDetail": string, "tags": [1-3 short Korean tags]}
"name" is the person's name in the card's main script (Korean if present); "nameSub" is the same name in another script (Hanja/English/Kanji).
Keep phone numbers, emails and addresses exactly as printed.`;
function stripFences(s){
  s = String(s||'').trim();
  if (s.startsWith('```')) s = s.replace(/^```[a-z]*\n?/i,'').replace(/\n?```$/,'');
  const m = s.match(/\{[\s\S]*\}/);
  return m ? m[0] : s;
}
let CACHED_GEMINI_MODEL = null;
async function resolveGeminiModel(key){
  if (CFG.model && CFG.model.trim()) return CFG.model.trim();                    // 사용자가 지정한 모델
  if (CACHED_GEMINI_MODEL) return CACHED_GEMINI_MODEL;
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
    if (res.ok){
      const data = await res.json();
      const avail = (data.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,''));
      const flash = avail.filter(m=>/flash/.test(m) && !/(image|tts|thinking|live|audio|embedding)/.test(m));
      flash.sort((a,b)=>{                                                          // 버전 높은 flash 우선, preview는 뒤로
        const va = parseFloat((a.match(/gemini-(\d+(?:\.\d+)?)/)||[])[1]||0), vb = parseFloat((b.match(/gemini-(\d+(?:\.\d+)?)/)||[])[1]||0);
        return (vb - va) || (/preview|exp/.test(a) - /preview|exp/.test(b)) || (/lite/.test(a) - /lite/.test(b));
      });
      CACHED_GEMINI_MODEL = flash[0] || (avail.includes('gemini-flash-latest') ? 'gemini-flash-latest' : avail[0]);
      if (CACHED_GEMINI_MODEL) return CACHED_GEMINI_MODEL;
    }
  } catch(e){ console.warn('모델 목록 조회 실패', e); }
  return 'gemini-flash-latest';
}
async function fetchTimeout(url, opts, ms){                                      // 시간 제한 fetch
  const ctrl = new AbortController(); const t = setTimeout(()=>ctrl.abort(), ms);
  try { return await fetch(url, Object.assign({}, opts, { signal:ctrl.signal })); }
  finally { clearTimeout(t); }
}
async function aiParse(dataUrl){
  if (CFG.provider === 'openai'){
    const res = await fetchTimeout('https://api.openai.com/v1/chat/completions', {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+CFG.key},
      body: JSON.stringify({ model: CFG.model || 'gpt-4o-mini', response_format:{type:'json_object'},
        messages:[{role:'user',content:[{type:'text',text:AI_PROMPT},{type:'image_url',image_url:{url:dataUrl}}]}], max_tokens:800 })
    }, 20000);
    if (!res.ok){ throw new Error('OpenAI ' + res.status + ' — ' + (await res.text()).slice(0,120)); }
    const j = await res.json();
    return JSON.parse(stripFences(j.choices[0].message.content));
  }
  const mime = (dataUrl.match(/^data:([^;]+);base64,/)||[])[1] || 'image/jpeg';
  const b64 = dataUrl.split(',')[1];
  const model = await resolveGeminiModel(CFG.key);
  const tryModels = [...new Set([model, 'gemini-flash-latest'])];
  let lastErr = null;
  for (const m of tryModels){
    try {
      const res = await fetchTimeout(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`, {
        method:'POST', headers:{ 'Content-Type':'application/json', 'x-goog-api-key':CFG.key },
        body: JSON.stringify({ contents:[{ parts:[{ text:AI_PROMPT }, { inline_data:{ mime_type:mime, data:b64 } }] }],
          generationConfig:{ temperature:0.1, response_mime_type:'application/json' } })
      }, 20000);
      if (!res.ok) throw new Error(`HTTP ${res.status} — ${(await res.text()).slice(0,120)}`);
      const j = await res.json();
      const text = (j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
      const r = JSON.parse(stripFences(text));
      if (r && (r.name || r.company || r.mobile || r.tel || r.email)) return r;
      throw new Error('빈 응답');
    } catch(err){ lastErr = err; }
  }
  throw lastErr || new Error('Gemini 응답 실패');
}

/* =========================================================
   O. 설정 (인식 엔진 · AI 키 · 백업/복원)
   ========================================================= */
gearBtn.onclick = ()=>{
  openSheet(`
    <h2 class="sh">설정</h2>
    <div class="pill"><i></i>${esc(engineName())}${HAS_NATIVE_SCAN?' · 구글 스캔 모드':' · 앱 내 스캔 모드'}</div>
    <p class="shd" style="margin-top:12px">키 없이도 동작해요. Gemini나 OpenAI 키를 넣으면 이름·직함·한자까지 더 정확하게 읽어요. 키는 이 기기에만 저장돼요.</p>
    <div class="setrow"><label>AI 제공사</label>
      <select id="s_provider">
        <option value="gemini" ${CFG.provider==='gemini'?'selected':''}>Google Gemini (최신 Flash 자동)</option>
        <option value="openai" ${CFG.provider==='openai'?'selected':''}>OpenAI (gpt-4o-mini)</option>
      </select></div>
    <div class="setrow"><label>모델 (비워 두면 자동)</label><input id="s_model" value="${esc(CFG.model||'')}" placeholder="${CFG.provider==='openai'?'gpt-4o-mini':'자동'}"></div>
    <div class="setrow"><label>API 키</label><input id="s_key" type="password" value="${esc(CFG.key||'')}" placeholder="AIza… 또는 sk-…" autocomplete="off"></div>
    <div class="btns" style="margin-top:6px">
      <button class="btn ghost" id="s_clear">키 지우기</button>
      <button class="btn ink" id="s_save">저장</button>
    </div>
    <div class="sdiv"></div>
    <h2 class="sh" style="font-size:18px">백업 · 복원</h2>
    <p class="shd">직접 스캔한 명함 <b style="color:var(--ink)">${MY.length}장</b>을 파일 하나로 저장해요. 앱을 다시 설치하거나 기기를 바꿀 때 복원하세요.</p>
    <div class="btns" style="margin-top:0">
      <button class="btn" id="b_export">${ICON.drive} 백업 저장</button>
      <button class="btn" id="b_import">복원하기</button>
    </div>
    <div class="note">· 백업 파일에는 명함 사진이 포함되고 <b>API 키는 포함되지 않아요</b>.<br>· 복원하면 같은 명함은 덮어쓰고 새 명함은 추가돼요.</div>`);
  $('s_provider').onchange = e=>{ $('s_model').placeholder = e.target.value==='openai' ? 'gpt-4o-mini' : '자동'; };
  $('s_save').onclick = ()=>{
    CFG = { provider:$('s_provider').value, model:$('s_model').value.trim(), key:$('s_key').value.trim() };
    CACHED_GEMINI_MODEL = null;
    localStorage.setItem(LS_CFG, JSON.stringify(CFG));
    rebuild(); closeSheet(); toastMsg(CFG.key ? 'AI 설정을 저장했어요' : '설정을 저장했어요');
  };
  $('s_clear').onclick = ()=>{ CFG.key=''; localStorage.setItem(LS_CFG, JSON.stringify(CFG)); $('s_key').value=''; rebuild(); toastMsg('키를 지웠어요'); };
  $('b_export').onclick = exportBackup;
  $('b_import').onclick = ()=>$('fileRestore').click();
};

function exportBackup(){
  if (!MY.length){ toastMsg('백업할 명함이 없어요'); return; }
  const payload = JSON.stringify({ app:'executive-vault', version:2, exportedAt:new Date().toISOString(), cards:MY });
  const name = `명함갈피_백업_${today().replace(/-/g,'')}.json`;
  if (NATIVE && typeof NATIVE.saveTextFile === 'function'){ NATIVE.saveTextFile(name, 'application/json', payload); return; } // 새 APK
  if (NATIVE && typeof NATIVE.shareOrSaveImage === 'function'){                   // 구버전 APK: 사진 저장 브리지 활용
    NATIVE.shareOrSaveImage(name, 'data:application/json;base64,' + btoa(unescape(encodeURIComponent(payload))));
    toastMsg('사진/BusinessCards 폴더에 백업 파일을 저장했어요. 공유창에서 드라이브에도 보관하세요', 5000);
    return;
  }
  const blob = new Blob([payload], {type:'application/json'});
  const file = new File([blob], name, {type:'application/json'});
  if (navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({files:[file], title:name}).catch(()=>downloadBlob(blob, name)); return; }
  downloadBlob(blob, name); toastMsg('백업 파일을 내려받았어요');
}
$('fileRestore').onchange = async e=>{
  const f = e.target.files[0]; $('fileRestore').value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    const cards = Array.isArray(j) ? j : j.cards;
    if (!Array.isArray(cards)) throw new Error('명함 백업 파일이 아니에요');
    let added = 0, updated = 0;
    cards.forEach(c=>{
      if (!c || !c.id || !(c.name || c.company)) return;
      c.mine = true;
      const i = MY.findIndex(x=>x.id === c.id);
      if (i >= 0){ MY[i] = c; updated++; } else { MY.push(c); added++; }
    });
    saveMy(); closeSheet(); setPrivate(false);
    toastMsg(`복원 완료 — 새 명함 ${added}장, 갱신 ${updated}장`, 3200);
  } catch(err){ toastMsg('복원 실패: ' + (err.message || '파일을 읽을 수 없어요'), 3600); }
};
