<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1b4b">
<meta name="description" content="모바일 명함 관리 앱 — 촬영·AI 인식·검색, 전화, 메일, vCard 저장">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="명함갈피">
<title>명함 갈피 — Business Cards</title>
<style>
:root{
  --bg:#0f0d1e; --bg2:#161331; --card:#1e1b3f; --card2:#262153;
  --line:rgba(255,255,255,.09);
  --txt:#f1f0fb; --sub:#a5a1c8; --faint:#6f6b96;
  --acc:#8b7cf7; --acc2:#c4b9ff; --ok:#4ade80;
  --radius:18px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Pretendard","Noto Sans KR","Apple SD Gothic Neo",Roboto,sans-serif;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  color:var(--txt); min-height:100dvh;
  padding-bottom:calc(110px + var(--safe-b));
}
header.app{
  position:sticky; top:0; z-index:20;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 12px;
  background:linear-gradient(180deg,rgba(15,13,30,.96) 70%,rgba(15,13,30,0));
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
h1 .logo{width:28px;height:28px;border-radius:8px;flex:0 0 auto}
h1 small{font-size:12px;font-weight:600;color:var(--faint);margin-left:auto;background:var(--card);padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.gear{
  flex:0 0 auto;width:34px;height:34px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);color:var(--sub);display:flex;align-items:center;justify-content:center;
  cursor:pointer;margin-left:8px;
}
.gear svg{width:17px;height:17px}
.gear.has{color:var(--ok);border-color:rgba(74,222,128,.4)}
.searchwrap{margin-top:14px;position:relative}
.searchwrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--faint)}
#search{
  width:100%;padding:12px 38px 12px 40px;font-size:15px;color:var(--txt);
  background:var(--card);border:1px solid var(--line);border-radius:14px;outline:none;
  transition:border-color .15s;
}
#search:focus{border-color:var(--acc)}
#search::placeholder{color:var(--faint)}
#clearBtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:none;border:0;background:transparent;color:var(--faint);font-size:19px;padding:6px 8px;cursor:pointer}
.filters{display:flex;gap:7px;margin-top:11px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;
  background:var(--card);color:var(--sub);border:1px solid var(--line);cursor:pointer;transition:all .15s;
}
.chip.on{background:linear-gradient(135deg,#6d5cf0,#8b7cf7);color:#fff;border-color:transparent}
.chip.sort{margin-left:auto}
.count{padding:14px 18px 4px;font-size:12px;color:var(--faint);font-weight:600}
main{padding:8px 16px 0;max-width:640px;margin:0 auto}
.list{display:flex;flex-direction:column;gap:12px}
.carditem{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 16px;display:flex;gap:14px;align-items:center;cursor:pointer;
  transition:transform .12s,border-color .15s;position:relative;
}
.carditem:active{transform:scale(.985)}
.carditem:hover{border-color:rgba(139,124,247,.45)}
.mine{
  position:absolute;top:-1px;right:14px;font-size:9.5px;font-weight:800;letter-spacing:.04em;
  color:#0f0d1e;background:linear-gradient(135deg,#4ade80,#22d3ee);padding:3px 8px;border-radius:0 0 6px 6px;
}
.avatar{
  width:50px;height:50px;border-radius:14px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,#6d5cf0,#a78bfa);
}
.ci-body{min-width:0;flex:1}
.ci-name{font-size:16.5px;font-weight:750;letter-spacing:-.01em;display:flex;align-items:baseline;gap:7px}
.ci-name .hanja{font-size:12.5px;color:var(--sub);font-weight:600}
.ci-title{font-size:12.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-company{font-size:12.5px;color:var(--acc2);margin-top:5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-actions{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
.abtn{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--acc2);
  background:rgba(139,124,247,.10);text-decoration:none;transition:background .15s;
}
.abtn:active{background:rgba(139,124,247,.28)}
.abtn svg{width:18px;height:18px}
.empty{text-align:center;color:var(--faint);padding:70px 20px;font-size:14px;line-height:1.7}
.empty b{color:var(--sub)}

/* FAB */
.fab{
  position:fixed;right:18px;bottom:calc(24px + var(--safe-b));z-index:30;
  border:0;cursor:pointer;color:#fff;font-family:inherit;
  padding:15px 21px;border-radius:999px;font-size:14.5px;font-weight:800;letter-spacing:-.01em;
  display:flex;align-items:center;gap:9px;
  background:linear-gradient(135deg,#6d5cf0,#a855f7);
  box-shadow:0 10px 30px rgba(109,92,240,.45),0 3px 10px rgba(0,0,0,.4);
  transition:transform .12s;
}
.fab:active{transform:scale(.95)}
.fab svg{width:20px;height:20px}

/* sheets */
.sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .dim{position:absolute;inset:0;background:rgba(5,4,15,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet .panel{
  position:relative;width:100%;max-width:640px;max-height:92dvh;overflow-y:auto;
  background:var(--bg2);border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;
  padding:14px 18px calc(28px + var(--safe-b));
  animation:up .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:42px;height:4px;border-radius:99px;background:rgba(255,255,255,.22);margin:0 auto 16px}
h2.sh{font-size:17px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
p.shd{font-size:12.5px;color:var(--sub);line-height:1.6;margin-bottom:14px}
.addmenu{display:grid;gap:10px}
.addbtn{
  border:1px solid var(--line);background:var(--card);border-radius:16px;padding:17px 16px;
  display:flex;align-items:center;gap:13px;cursor:pointer;color:var(--txt);font-family:inherit;text-align:left;
}
.addbtn:active{background:var(--card2)}
.addbtn .ic{width:42px;height:42px;border-radius:13px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:19px;background:rgba(139,124,247,.14)}
.addbtn b{display:block;font-size:14.5px;font-weight:750}
.addbtn span{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
.addbtn svg{width:20px;height:20px}

/* detail */
.d-head{display:flex;gap:15px;align-items:center}
.d-head .avatar{width:58px;height:58px;font-size:22px;border-radius:16px}
.d-name{font-size:21px;font-weight:800;letter-spacing:-.02em}
.d-name .hanja{font-size:14px;color:var(--sub);font-weight:600;margin-left:7px}
.d-title{font-size:13px;color:var(--sub);margin-top:3px}
.d-company{font-size:13.5px;color:var(--acc2);font-weight:700;margin-top:8px}
.d-sub{font-size:12px;color:var(--faint);margin-top:2px;line-height:1.5}
.d-img{margin-top:16px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff;display:block}
.d-img img{width:100%;display:block}
a.d-img{cursor:zoom-in}
.d-tags{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.d-tags span{font-size:11.5px;font-weight:700;color:var(--acc2);background:rgba(139,124,247,.14);border:1px solid rgba(139,124,247,.3);padding:4px 11px;border-radius:999px}
.d-rows{margin-top:16px;display:flex;flex-direction:column}
.d-row{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--txt)}
.d-row:last-child{border-bottom:0}
.d-row svg{width:19px;height:19px;stroke:var(--acc2);flex:0 0 auto}
.d-row .lbl{font-size:11px;color:var(--faint);font-weight:700;width:52px;flex:0 0 auto}
.d-row .val{font-size:14.5px;flex:1;min-width:0;word-break:break-all}
.d-row .go{color:var(--faint);font-size:17px;flex:0 0 auto}
.d-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
.dbtn{
  padding:13px 10px;border-radius:14px;border:0;cursor:pointer;
  font-size:14px;font-weight:750;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:7px;
  background:var(--card2);color:var(--txt);text-decoration:none;
}
.dbtn svg{width:17px;height:17px}
.dbtn.primary{background:linear-gradient(135deg,#6d5cf0,#8b7cf7);color:#fff}
.dbtn.danger{background:rgba(248,113,113,.14);color:#fca5a5;border:1px solid rgba(248,113,113,.3)}

/* form */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fgrid .full{grid-column:1/-1}
.fld label{display:block;font-size:11px;font-weight:750;color:var(--faint);margin:10px 2px 5px;letter-spacing:.02em}
.fld input,.fld textarea{
  width:100%;padding:11px 13px;font-size:14px;color:var(--txt);font-family:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:12px;outline:none;
}
.fld input:focus,.fld textarea:focus{border-color:var(--acc)}
.fld textarea{resize:vertical;min-height:56px}
.preview{
  margin:6px 0 4px;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background:#fff;position:relative;
}
.preview img{width:100%;display:block;max-height:38dvh;object-fit:cover}
.preview .rebtn{
  position:absolute;right:10px;bottom:10px;border:0;cursor:pointer;font-family:inherit;
  background:rgba(15,13,30,.82);color:#fff;font-size:11.5px;font-weight:700;padding:7px 12px;border-radius:999px;
}
.aistatus{
  display:none;margin-top:12px;padding:11px 14px;border-radius:12px;font-size:12.5px;line-height:1.55;
  background:rgba(139,124,247,.10);border:1px solid rgba(139,124,247,.3);color:var(--acc2);
}
.aistatus.show{display:block}
.aistatus.err{background:rgba(248,113,113,.10);border-color:rgba(248,113,113,.35);color:#fca5a5}
.spin{
  display:inline-block;width:12px;height:12px;border:2px solid rgba(196,185,255,.35);border-top-color:var(--acc2);
  border-radius:50%;vertical-align:-2px;margin-right:7px;animation:sp .8s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
.setrow{margin-bottom:16px}
.setrow label{display:block;font-size:11.5px;font-weight:750;color:var(--faint);margin-bottom:6px}
.setrow select,.setrow input{
  width:100%;padding:12px 13px;font-size:14px;color:var(--txt);font-family:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:12px;outline:none;
}
.setrow select:focus,.setrow input:focus{border-color:var(--acc)}
.note{font-size:11.5px;color:var(--faint);line-height:1.7;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:6px}
.note b{color:var(--sub)}
footer{max-width:640px;margin:26px auto 0;padding:0 18px;text-align:center;font-size:11.5px;color:var(--faint);line-height:1.8}
.toast{
  position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translateX(-50%) translateY(20px);
  background:#2a2650;color:#fff;font-size:13px;font-weight:650;padding:11px 20px;border-radius:999px;
  border:1px solid rgba(139,124,247,.5);opacity:0;pointer-events:none;transition:all .25s;z-index:99;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;
}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (min-width:640px){ .carditem{padding:17px 18px} }
</style>
</head>
<body>

<header class="app">
  <h1>
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><rect x="3" y="9" width="42" height="30" rx="7" fill="#8b7cf7"/><circle cx="16" cy="21" r="4.6" fill="#fff"/><rect x="24" y="17.5" width="15" height="3.4" rx="1.7" fill="#fff"/><rect x="24" y="24.5" width="11" height="3" rx="1.5" fill="#c4b9ff" opacity=".8"/><rect x="10" y="30" width="28" height="3" rx="1.5" fill="#c4b9ff" opacity=".55"/></svg>
    명함 갈피
    <small id="totalCount"></small>
    <button class="gear" id="gearBtn" aria-label="AI 설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </h1>
  <div class="searchwrap">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="이름 · 회사 · 이메일 검색" autocomplete="off">
    <button id="clearBtn" aria-label="지우기">✕</button>
  </div>
  <div class="filters" id="filters"></div>
</header>

<div class="count" id="count"></div>
<main>
  <div class="list" id="list"></div>
  <div class="empty" id="empty" style="display:none">검색 결과가 없어요.<br><b>다른 키워드</b>로 찾아보거나 오른쪽 아래 <b>📷 버튼</b>으로 명함을 추가하세요.</div>
</main>

<footer>
  GitHub Pages에서 운영되는 개인 명함 앱이에요 · 설치 후에도 오프라인으로 열려요<br>
  📷로 찍은 명함은 이 기기에 저장되고, 리포지토리 README.md에 추가 방법이 있어요
</footer>

<button class="fab" id="fabBtn">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
  명함 촬영 / 추가
</button>
<input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
<input type="file" id="fileAlbum" accept="image/*" hidden>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="dim" id="dim"></div>
  <div class="panel" id="panel"></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
let BASE = [];      // data/cards.json 의 명함 (읽기 전용)
let MY = [];        // 이 기기에서 추가한 명함 (localStorage)
let CFG = {provider:'gemini', model:'', key:''};
let CARDS = [];     // 표시용 병합 목록
let state = { q:'', tag:null, sort:'name' };

const LS_MY = 'cards_my_v1', LS_CFG = 'cards_ai_cfg_v1';
try { MY = JSON.parse(localStorage.getItem(LS_MY) || '[]'); } catch(e){ MY = []; }
try { CFG = Object.assign(CFG, JSON.parse(localStorage.getItem(LS_CFG) || '{}')); } catch(e){}

const list = document.getElementById('list');
const empty = document.getElementById('empty');
const countEl = document.getElementById('count');
const totalEl = document.getElementById('totalCount');
const filtersEl = document.getElementById('filters');
const sheet = document.getElementById('sheet');
const panel = document.getElementById('panel');
const toast = document.getElementById('toast');
const gearBtn = document.getElementById('gearBtn');

const ICON = {
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8.1 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.6 2z"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m2.5 6.5 9.5 7 9.5-7"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>',
  vcf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>'
};

function initials(name){
  const t = (name||'?').trim();
  if (/[가-힣]/.test(t)) return t.slice(t.length >= 3 ? 1 : 0);
  return t.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}
function toastMsg(m){
  toast.textContent = m; toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 2400);
}
function openSheet(html){ panel.innerHTML = '<div class="grab"></div>'+html; sheet.classList.add('open'); document.body.style.overflow='hidden'; }
function closeSheet(){ sheet.classList.remove('open'); document.body.style.overflow=''; }
document.getElementById('dim').onclick = closeSheet;

/* ---------- load & merge ---------- */
async function load(){
  const res = await fetch('data/cards.json');
  const data = await res.json();
  BASE = data.cards || [];
  rebuild();
}
function rebuild(){
  CARDS = BASE.concat(MY);
  totalEl.textContent = CARDS.length + '명';
  renderFilters();
  render();
}
function saveMy(){
  localStorage.setItem(LS_MY, JSON.stringify(MY));
  rebuild();
}

/* ---------- filters / list ---------- */
function allTags(){
  const s = new Set();
  CARDS.forEach(c => (c.tags||[]).forEach(t => s.add(t)));
  return [...s];
}
function renderFilters(){
  const tags = allTags();
  filtersEl.innerHTML =
    `<button class="chip ${state.tag?'':'on'}" data-tag="">전체</button>` +
    tags.map(t=>`<button class="chip ${state.tag===t?'on':''}" data-tag="${t}">${t}</button>`).join('') +
    `<button class="chip sort" data-sort>↕ ${state.sort==='name'?'이름순':state.sort==='company'?'회사순':'최근순'}</button>`;
  filtersEl.querySelectorAll('[data-tag]').forEach(b=>{
    b.onclick = ()=>{ state.tag = b.dataset.tag || null; renderFilters(); render(); };
  });
  filtersEl.querySelector('[data-sort]').onclick = ()=>{
    state.sort = state.sort==='name' ? 'company' : state.sort==='company' ? 'added' : 'name';
    renderFilters(); render();
  };
}
function filtered(){
  let arr = CARDS.filter(c=>{
    if (state.tag && !(c.tags||[]).includes(state.tag)) return false;
    if (!state.q) return true;
    const hay = [c.name,c.nameSub,c.title,c.company,c.companySub,c.email,c.address,(c.tags||[]).join(' '),
      ...(c.phones||[]).map(p=>p.number)].join(' ').toLowerCase();
    return state.q.toLowerCase().split(/\s+/).every(w=>hay.includes(w));
  });
  arr.sort((a,b)=>{
    if (state.sort==='company') return (a.company||'').localeCompare(b.company||'','ko') || a.name.localeCompare(b.name,'ko');
    if (state.sort==='added') return (b.added||'').localeCompare(a.added||'') || a.name.localeCompare(b.name,'ko');
    return a.name.localeCompare(b.name,'ko');
  });
  return arr;
}
function render(){
  const arr = filtered();
  countEl.textContent = state.q || state.tag ? `검색 ${arr.length}명 / 전체 ${CARDS.length}명` : `총 ${arr.length}명의 명함`;

function vcf(c){
  const p = t => (c.phones||[]).find(x=>x.type===t);

    'BEGIN:VCARD','VERSION:3.0',
    `N:${c.name}`,`FN:${c.name}`,
    `ORG:${c.company}`,
    c.title ? `TITLE:${c.title}` : '',
    mobile ? `TEL;TYPE=CELL,VOICE:${mobile.number}` : '',
    tel ? `TEL;TYPE=WORK,VOICE:${tel.number}` : '',
    c.fax ? `TEL;TYPE=WORK,FAX:${c.fax}` : '',
    c.email ? `EMAIL;TYPE=WORK:${c.email}` : '',
    c.website ? `URL:${c.website}` : '',
    c.address ? `ADR;TYPE=WORK:;;${c.address}${c.addressDetail?' '+c.addressDetail:''};;;;` : '',
    c.companySub ? `NOTE:${c.companySub}` : '',
    'END:VCARD'
  ].filter(Boolean);
  return lines.join('\r\n');
}

/* 이미지 압축: 최대 1200px, WebP 100KB대 목표 */
async function compressImage(file){
  const bmp = await createImageBitmap(file);
  const maxW = 1200;
  const w = Math.min(bmp.width, maxW), h = Math.round(bmp.height * (w / bmp.width));
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
  let q = 0.82, out = cv.toDataURL('image/webp', q);
  const isWebp = out.startsWith('data:image/webp');
  while (out.length > 200*1024 && q > 0.45){ q -= 0.12; out = cv.toDataURL(isWebp?'image/webp':'image/jpeg', q); }
  if (!isWebp) out = cv.toDataURL('image/jpeg', 0.8);
  return out;
}

async function handleImage(file){
  let dataUrl;
  try { dataUrl = await compressImage(file); }
  catch(err){ toastMsg('사진을 읽지 못했어요: '+err.message); return; }
  openAddForm({imageData:dataUrl, ai:true});
}

/* ---------- 무료 OCR (키 불필요, Tesseract.js) ---------- */
async function runOCR(dataUrl, el){
  if (typeof Tesseract === 'undefined'){
    setAIStatus(el, '⚠️ OCR 엔진을 불러오지 못했어요(오프라인?). 내용을 직접 입력하면 저장돼요.', true);
    return;
  }
  setAIStatus(el, '<span class="spin"></span>무료 OCR로 글자를 읽고 있어요… (10~30초, 처음 한 번은 더 걸려요)');
  try {
    const res = await Tesseract.recognize(dataUrl, 'kor+eng');
    const text = (res.data.text||'').trim();
    if (!text){
      setAIStatus(el, '⚠️ 글자를 읽지 못했어요. 사진을 선명하게 다시 찍거나 직접 입력하세요.', true);
      return;
    }
    const f = ocrExtract(text);
    fillForm(f);
    setAIStatus(el, '✅ 읽기 완료 — 전화·이메일 등을 채웠어요. 이름·회사·직함은 아래 원문을 참고해 확인하세요.' +
      `<details style="margin-top:8px"><summary style="cursor:pointer;font-size:11.5px;color:var(--faint)">읽은 원문 보기</summary><div style="margin-top:6px;white-space:pre-wrap;font-size:11px;line-height:1.6;color:var(--sub);background:var(--card);border-radius:10px;padding:10px;max-height:130px;overflow-y:auto">${esc(text)}</div></details>`);
  } catch(err){
    setAIStatus(el, '⚠️ OCR 실패: '+esc(err.message||'알 수 없는 오류')+'<br>내용을 직접 입력하면 그대로 저장돼요.', true);
  }
}
function ocrExtract(text){
  const out = {};
  const email = text.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/);
  if (email) out.email = email[0];
  const url = text.match(/(?:https?:\/\/|www\.)[A-Za-z0-9._~:/?#\[\]@!$&'()*+,;=%-]+/);
  if (url && !out.email) out.website = url[0].startsWith('http') ? url[0] : 'https://'+url[0];
  const lines = text.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const phoneRe = /\+?\(?\d{1,4}\)?[\d\-–—()\s.]{6,}\d/;
  const seen = new Set();
  const found = {mobile:[], tel:[], fax:[]};
  for (const line of lines){
    const m = line.match(phoneRe); if (!m) continue;
    let num = m[0].replace(/[–—]/g,'-').replace(/[\s.]/g,'').replace(/-+$/,'');
    const digits = num.replace(/\D/g,'');
    if (digits.length < 9 || digits.length > 13) continue;
    if (seen.has(digits)) continue;
    seen.add(digits);
    if (/fax|팩스/i.test(line)) found.fax.push(num);
    else if (/mobile|mob|cell|휴대|폰|H\.?P/i.test(line) || /^\+?(82)?0?1[01]/.test(digits) || /^\+?8[12]70/.test(digits) || /^0?10/.test(digits) || /^\+8170/.test(digits)) found.mobile.push(num);
    else found.tel.push(num);
  }
  if (found.mobile[0]) out.mobile = found.mobile[0];
  if (found.tel[0]) out.tel = found.tel[0];
  if (found.fax[0]) out.fax = found.fax[0];
  const addrLines = lines.filter(l => /([가-힣]{1,4}(시|군|구|동|로|길)\s*\d)|(號|番地)|\d+-?\d? (F|floor)|Tower|Building|Avenue|Street|Yurakucho|Chiyoda|Seoul|Tokyo/i.test(l) && !phoneRe.test(l) && !/tel|fax|팩스|email|www/i.test(l));
  if (addrLines.length){
    out.address = addrLines.slice(0,2).join(' ');
    const zip = text.match(/\b\d{5}\b|〒\s*\d{3}-?\d{4}/);
    if (zip) out.addressDetail = zip[0];
  }
  return out;
}

function stripFences(s){
  s = s.trim();
  if (s.startsWith('```')){ s = s.replace(/^```[a-z]*\n?/i,'').replace(/\n?```$/,''); }
  const m = s.match(/\{[\s\S]*\}/);
  return m ? m[0] : s;
}
function setAIStatus(el, html, isErr){
  el.classList.add('show'); el.classList.toggle('err', !!isErr); el.innerHTML = html;
}
async function runAI(dataUrl, el){

  try {
    const j = await aiParse(dataUrl);
    fillForm(j);
    setAIStatus(el, '✅ AI 인식 완료 — 읽은 내용을 입력창에 채웠어요. 틀린 부분은 직접 고치세요.');
  } catch(err){
    setAIStatus(el, '⚠️ AI 인식 실패: '+esc(err.message)+'<br>사진은 그대로라서, 내용을 직접 입력하면 저장돼요.', true);
  }
}
async function aiParse(dataUrl){
  if (CFG.provider === 'openai'){
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+CFG.key},
      body: JSON.stringify({
        model: CFG.model || 'gpt-4o-mini',
        messages:[{role:'user',content:[
          {type:'text',text:AI_PROMPT},
          {type:'image_url',image_url:{url:dataUrl}}
        ]}],
        max_tokens:800
      })
    });
    if (!res.ok){ const t = await res.text(); throw new Error('OpenAI '+res.status+' — '+t.slice(0,140)); }
    const j = await res.json();
    return JSON.parse(stripFences(j.choices[0].message.content));
  } else {
    const model = CFG.model || 'gemini-1.5-flash';
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(CFG.key)}`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        contents:[{parts:[{text:AI_PROMPT},{inline_data:{mime_type:'image/webp',data:dataUrl.split(',')[1]}}]}],
        generationConfig:{temperature:0.1, response_mime_type:'application/json'}
      })
    });
    if (!res.ok){ const t = await res.text(); throw new Error('Gemini '+res.status+' — '+t.slice(0,140)); }
    const j = await res.json();
    const text = j.candidates[0].content.parts.map(p=>p.text||'').join('');
    return JSON.parse(stripFences(text));
  }
}
function fillForm(j){
  const set = (id,v)=>{ const el=document.getElementById(id); if(el && v!=null) el.value = v; };
  set('f_name', j.name); set('f_nameSub', j.nameSub); set('f_title', j.title);
  set('f_company', j.company); set('f_companySub', j.companySub);
  set('f_mobile', j.mobile); set('f_tel', j.tel); set('f_fax', j.fax);
  set('f_email', j.email); set('f_website', j.website);
  set('f_address', j.address); set('f_addressDetail', j.addressDetail);
  if (Array.isArray(j.tags)) set('f_tags', j.tags.join(', '));
}

    </div>
    <div class="setrow"><label>API 키</label>
      <input id="s_key" type="password" value="${esc(CFG.key||'')}" placeholder="AIza… 또는 sk-…" autocomplete="off">
    </div>
    <div class="note">
      <b>키 발급 안내</b><br>
      · Gemini: <b>aistudio.google.com/apikey</b> (무료 할당량 있음) — 발급 후 위에 붙여넣기<br>
      · OpenAI: <b>platform.openai.com/api-keys</b> (유료 크레딧 사용)<br>
      · 키는 GitHub에 올라가지 않고 이 브라우저(localStorage)에만 저장됩니다.
    </div>
    <div class="d-actions" style="margin-top:18px">
      <button class="dbtn" id="s_clear">키 지우기</button>
      <button class="dbtn primary" id="s_save">저장</button>

  document.getElementById('s_provider').onchange = e=>{
    document.getElementById('s_model').placeholder = e.target.value==='openai' ? 'gpt-4o-mini' : 'gemini-1.5-flash';
  };
  document.getElementById('s_save').onclick = ()=>{

      key: document.getElementById('s_key').value.trim()
    };

  };
  document.getElementById('s_clear').onclick = ()=>{
    CFG.key=''; localStorage.setItem(LS_CFG, JSON.stringify(CFG));
    gearBtn.classList.remove('has');

gearBtn.classList.toggle('has', !!CFG.key);

/* ---------- search ---------- */
const search = document.getElementById('search');
const clearBtn = document.getElementById('clearBtn');
search.addEventListener('input', ()=>{
  state.q = search.value.trim();
  clearBtn.style.display = state.q ? 'block' : 'none';
  render();
});
clearBtn.onclick = ()=>{ search.value=''; state.q=''; clearBtn.style.display='none'; render(); search.blur(); };

if ('serviceWorker' in navigator) {
  addEventListener('load', ()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

load();
