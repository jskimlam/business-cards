<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA">
<meta name="description" content="명함 갈피 — 스캔 한 번으로 정리되는 나만의 명함첩">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="명함 갈피">
<title>명함 갈피 — Card Atelier</title>
<!-- 글꼴: 본문 Pretendard, 이름·제목 Noto Serif KR (오프라인이면 기기 글꼴로 대체) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* =========================================================
   1. 디자인 토큰 — 종이(Paper) · 먹(Ink) · 인주(Seal)
   ========================================================= */
:root{
  --paper:#F4F1EA; --paper2:#ECE7DC; --paper3:#E3DDD0; --card:#FFFFFF; --card2:#FBF9F5;
  --ink:#1A1D26; --ink2:#3B3E48; --sub:#76736B; --faint:#A6A196;
  --line:rgba(26,29,38,.10); --line2:rgba(26,29,38,.16);
  --seal:#C8402A; --seal-deep:#A8331F; --seal-soft:rgba(200,64,42,.09); --seal-line:rgba(200,64,42,.32);
  --ok:#2F7D5B; --ok-soft:rgba(47,125,91,.1); --warn:#B7791F;
  --serif:"Noto Serif KR","Nanum Myeongjo","Noto Serif CJK KR","Apple SD Gothic Neo",serif;
  --sans:"Pretendard Variable","Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Roboto,sans-serif;
  --shadow-card:0 1px 1px rgba(26,29,38,.04),0 6px 16px rgba(26,29,38,.07);
  --shadow-lift:0 2px 4px rgba(26,29,38,.06),0 18px 40px rgba(26,29,38,.16);
  --ease:cubic-bezier(.2,.8,.25,1);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:var(--paper)}
body{
  font-family:var(--sans);color:var(--ink);background:var(--paper);min-height:100dvh;
  padding-bottom:calc(118px + var(--safe-b));-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  /* 종이 결 느낌의 아주 옅은 점 무늬 */
  background-image:radial-gradient(rgba(26,29,38,.035) 1px,transparent 1.2px);background-size:22px 22px;
}
button{font-family:inherit;color:inherit}
svg{display:block}
.wrap{max-width:620px;margin:0 auto;padding:0 20px}

/* =========================================================
   2. 머리말 (날짜 · 제목 · 요약)
   ========================================================= */
.masthead{padding:calc(var(--safe-t) + 18px) 0 6px}
.mh-top{display:flex;align-items:center;gap:8px}
.dateline{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--sub);text-transform:uppercase}
.mh-top .sp{flex:1}
.rbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-card);transition:transform .12s var(--ease)}
.rbtn:active{transform:scale(.93)}
.rbtn svg{width:18px;height:18px;stroke:var(--ink2)}
.rbtn.on{background:var(--ink);border-color:var(--ink)}
.rbtn.on svg{stroke:var(--paper)}
.rbtn .dot{position:absolute}
.title-row{display:flex;align-items:flex-end;gap:12px;margin-top:14px}
h1.title{font-family:var(--serif);font-weight:900;font-size:34px;letter-spacing:-.04em;line-height:1.05}
.seal-mark{width:30px;height:30px;border-radius:7px;background:var(--seal);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:900;font-size:15px;transform:rotate(-6deg);margin-bottom:4px;box-shadow:0 3px 8px rgba(200,64,42,.3)}
.summary{margin-top:8px;font-size:13px;color:var(--sub);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.summary b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.summary .sep{width:3px;height:3px;border-radius:50%;background:var(--faint)}
.summary .eng{color:var(--seal);font-weight:750}

/* =========================================================
   3. 검색 · 필터
   ========================================================= */
.searchbar{position:relative;margin-top:18px}
.searchbar svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--sub)}
#search{width:100%;height:50px;padding:0 44px 0 46px;font-size:15px;font-family:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;outline:none;box-shadow:var(--shadow-card);transition:border-color .15s,box-shadow .15s}
#search:focus{border-color:var(--ink2);box-shadow:0 0 0 4px rgba(26,29,38,.06)}
#search::placeholder{color:var(--faint)}
#clearBtn{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:none;border:0;background:var(--paper2);width:26px;height:26px;border-radius:50%;font-size:12px;cursor:pointer;color:var(--sub)}
.filters{display:flex;gap:6px;margin:12px -20px 0;padding:0 20px 4px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:34px;padding:0 14px;border-radius:999px;font-size:12.5px;font-weight:700;background:transparent;color:var(--ink2);border:1px solid var(--line2);cursor:pointer;transition:all .15s}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.sort{margin-left:auto;border-style:dashed}

/* =========================================================
   4. 명함첩 목록 (ㄱㄴㄷ 색인)
   ========================================================= */
.book{margin-top:14px}
.idx{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:14px 0 8px;background:linear-gradient(180deg,var(--paper) 80%,rgba(244,241,234,0))}
.idx b{font-family:var(--sans);font-weight:900;font-size:16px;color:var(--seal);min-width:18px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idx i{flex:1;height:1px;background:var(--line2)}
.idx span{font-size:11px;color:var(--faint);font-weight:700}
.row{display:flex;align-items:center;gap:14px;padding:12px 12px 12px 12px;margin:0 -12px;border-radius:16px;cursor:pointer;transition:background .15s;animation:rise .35s var(--ease) both}
.row:active{background:var(--paper2)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mini{width:64px;height:38px;flex:0 0 auto;border-radius:5px;background:var(--card);box-shadow:0 1px 2px rgba(26,29,38,.12),0 4px 10px rgba(26,29,38,.10);overflow:hidden;position:relative}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.mini.gen{padding:6px 7px;display:flex;flex-direction:column;justify-content:space-between}
.mini.gen em{font-style:normal;font-family:var(--serif);font-weight:700;font-size:9px;color:var(--ink);white-space:nowrap;overflow:hidden}
.mini.gen u{display:block;height:2px;width:60%;background:var(--paper3);text-decoration:none;border-radius:2px}
.mini.gen u+u{width:40%}
.mini.gen s{position:absolute;right:5px;top:5px;width:8px;height:8px;border-radius:2px;background:var(--seal);text-decoration:none}
.r-body{flex:1;min-width:0}
.r-name{font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:7px;white-space:nowrap;overflow:hidden}
.r-name small{font-family:var(--sans);font-size:11.5px;font-weight:600;color:var(--faint);overflow:hidden;text-overflow:ellipsis}
.r-meta{font-size:12.5px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-meta b{color:var(--ink2);font-weight:700}
.r-tag{font-size:9.5px;font-weight:800;letter-spacing:.06em;color:var(--seal);border:1px solid var(--seal-line);padding:1px 5px;border-radius:4px;margin-left:2px}
.callbtn{width:40px;height:40px;border-radius:50%;flex:0 0 auto;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;background:var(--card);text-decoration:none}
.callbtn svg{width:17px;height:17px;stroke:var(--ink)}
.callbtn:active{background:var(--ink)}
.callbtn:active svg{stroke:var(--paper)}
/* 프라이빗 모드: 이름·연락처 흐리게 */
body.private .r-name,body.private .r-meta,body.private .mini img{filter:blur(6px);opacity:.75}
body.private .callbtn{opacity:.3;pointer-events:none}
.private-note{display:none;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px dashed var(--line2);font-size:12.5px;color:var(--sub);align-items:center;gap:10px}
body.private .private-note{display:flex}
.private-note b{color:var(--ink)}
.private-note button{margin-left:auto;border:0;background:var(--ink);color:var(--paper);font-weight:800;font-size:12px;padding:8px 13px;border-radius:999px;cursor:pointer;flex:0 0 auto}
/* 빈 화면 */
.empty{display:none;text-align:center;padding:40px 10px 20px}
.stack{position:relative;width:180px;height:120px;margin:0 auto 22px}
.stack i{position:absolute;inset:0;border-radius:10px;background:var(--card);box-shadow:var(--shadow-card)}
.stack i:nth-child(1){transform:rotate(-8deg) translate(-10px,6px);background:var(--paper2)}
.stack i:nth-child(2){transform:rotate(5deg) translate(10px,2px)}
.stack i:nth-child(3){display:flex;flex-direction:column;justify-content:center;padding:0 20px;gap:7px}
.stack i:nth-child(3)::before{content:'';width:46%;height:8px;border-radius:3px;background:var(--ink)}
.stack i:nth-child(3)::after{content:'';width:70%;height:4px;border-radius:3px;background:var(--paper3)}
.stack em{position:absolute;right:16px;top:14px;width:22px;height:22px;border-radius:5px;background:var(--seal);transform:rotate(-8deg)}
.empty h3{font-family:var(--serif);font-size:20px;font-weight:900;letter-spacing:-.03em}
.empty p{font-size:13px;color:var(--sub);line-height:1.7;margin-top:6px}

footer{margin-top:34px;text-align:center;font-size:11px;color:var(--faint);line-height:1.8}

/* =========================================================
   5. 하단 도크 (앨범 · 스캔 · 직접 입력)
   ========================================================= */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-b));z-index:40;width:min(92vw,420px);height:72px;border-radius:26px;background:rgba(26,29,38,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;grid-template-columns:1fr 92px 1fr;align-items:center;box-shadow:0 14px 34px rgba(26,29,38,.32)}
.dk{border:0;background:transparent;color:rgba(244,241,234,.72);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;cursor:pointer;height:100%;justify-content:center}
.dk svg{width:22px;height:22px;stroke:currentColor}
.dk:active{color:#fff}
.scanbtn{justify-self:center;width:76px;height:76px;margin-top:-30px;border-radius:50%;border:5px solid var(--paper);background:var(--seal);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;box-shadow:0 10px 24px rgba(200,64,42,.42);transition:transform .14s var(--ease)}
.scanbtn:active{transform:scale(.92)}
.scanbtn svg{width:26px;height:26px;stroke:#fff}
.scanbtn span{font-size:10.5px;font-weight:850;letter-spacing:.02em}

/* =========================================================
   6. 바텀시트
   ========================================================= */
.sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .dim{position:absolute;inset:0;background:rgba(26,29,38,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .2s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet .panel{position:relative;width:100%;max-width:620px;max-height:94dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--paper);border-radius:28px 28px 0 0;padding:10px 20px calc(28px + var(--safe-b));animation:up .28s var(--ease) both;box-shadow:0 -10px 40px rgba(26,29,38,.18)}
@keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line2);margin:0 auto 18px}
h2.sh{font-family:var(--serif);font-size:22px;font-weight:900;letter-spacing:-.035em}
p.shd{font-size:13px;color:var(--sub);line-height:1.6;margin:6px 0 16px}
.btn{height:50px;border-radius:15px;border:1px solid var(--line2);background:var(--card);font-size:14.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;color:var(--ink);transition:transform .12s var(--ease)}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px;stroke:currentColor}
.btn.ink{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.seal{background:var(--seal);color:#fff;border-color:var(--seal)}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;color:var(--seal);border-color:var(--seal-line)}
.btn:disabled{opacity:.4}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.btns .full{grid-column:1/-1}

/* =========================================================
   7. 상세 보기
   ========================================================= */
.cardface{position:relative;margin:4px 0 0;border-radius:12px;overflow:hidden;background:var(--card);box-shadow:var(--shadow-lift);aspect-ratio:1.75}
.cardface img{width:100%;height:100%;object-fit:contain;display:block;background:var(--card)}
.cardface.gen{padding:22px 24px;display:flex;flex-direction:column;justify-content:space-between}
.cardface.gen .co{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--ink2)}
.cardface.gen .nm{font-family:var(--serif);font-size:28px;font-weight:900;letter-spacing:-.03em}
.cardface.gen .nm small{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--sub);margin-left:8px}
.cardface.gen .ct{font-size:11.5px;color:var(--sub);line-height:1.6}
.cardface.gen .st{position:absolute;right:22px;top:20px;width:36px;height:36px;border-radius:8px;background:var(--seal);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:900;font-size:16px;transform:rotate(-6deg)}
.zoom{position:absolute;right:10px;bottom:10px;border:0;background:rgba(26,29,38,.75);color:#fff;font-size:11px;font-weight:750;padding:6px 10px;border-radius:999px;text-decoration:none}
.d-name{margin-top:22px;font-family:var(--serif);font-size:28px;font-weight:900;letter-spacing:-.04em;line-height:1.15}
.d-name small{font-family:var(--sans);font-size:14px;color:var(--sub);font-weight:600;margin-left:8px;letter-spacing:0}
.d-role{margin-top:6px;font-size:14px;color:var(--ink2);line-height:1.5}
.d-role b{font-weight:800}
.d-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.d-tags span{font-size:11.5px;font-weight:750;color:var(--seal);background:var(--seal-soft);padding:4px 10px;border-radius:999px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.qa{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:var(--ink);font-size:11.5px;font-weight:750;border:0;background:transparent;cursor:pointer}
.qa i{width:54px;height:54px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-card);transition:transform .12s var(--ease)}
.qa:active i{transform:scale(.92)}
.qa i svg{width:21px;height:21px;stroke:var(--ink)}
.qa.main i{background:var(--ink);border-color:var(--ink)}
.qa.main i svg{stroke:var(--paper)}
.qa.off{opacity:.3;pointer-events:none}
.info{margin-top:20px;background:var(--card);border-radius:18px;border:1px solid var(--line);overflow:hidden}
.irow{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.irow:last-child{border-bottom:0}
.irow .k{width:52px;flex:0 0 auto;font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--faint);padding-top:2px}
.irow .v{flex:1;min-width:0;font-size:14.5px;line-height:1.5;word-break:break-all}
.irow .v small{display:block;color:var(--sub);font-size:12px}
.irow .go{color:var(--faint);font-size:16px}
.irow:active{background:var(--card2)}
.fname{font-size:11px;color:var(--faint);text-align:center;margin-top:-2px}
.fname span{font-family:ui-monospace,monospace;color:var(--ink2)}

/* =========================================================
   8. 추가 메뉴 · 폼
   ========================================================= */
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left;margin-bottom:10px;box-shadow:var(--shadow-card)}
.opt:active{background:var(--card2)}
.opt .oi{width:46px;height:46px;border-radius:15px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--paper2)}
.opt .oi svg{width:22px;height:22px;stroke:var(--ink)}
.opt.hero .oi{background:var(--seal)}
.opt.hero .oi svg{stroke:#fff}
.opt b{display:block;font-size:15px;font-weight:800}
.opt small{display:block;font-size:12px;color:var(--sub);margin-top:3px;line-height:1.45}
.rec{display:inline-block;font-size:9.5px;font-weight:850;color:var(--seal);border:1px solid var(--seal-line);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.preview{position:relative;border-radius:12px;overflow:hidden;background:var(--card);box-shadow:var(--shadow-lift);margin-bottom:6px}
.preview img{width:100%;display:block;max-height:32dvh;object-fit:contain;background:var(--card)}
.preview .rebtn{position:absolute;right:10px;bottom:10px;border:0;cursor:pointer;background:rgba(26,29,38,.82);color:#fff;font-size:11.5px;font-weight:750;padding:8px 12px;border-radius:999px}
.fsec{font-size:10.5px;font-weight:850;letter-spacing:.16em;color:var(--seal);margin:24px 0 2px;display:flex;align-items:center;gap:10px}
.fsec::after{content:'';flex:1;height:1px;background:var(--line2)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.fgrid .full{grid-column:1/-1}
.fld{position:relative}
.fld label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:750;color:var(--sub);margin:14px 0 2px}
.fld input,.fld textarea{width:100%;padding:8px 0 9px;font-size:16px;font-family:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--line2);outline:none;border-radius:0;transition:border-color .15s}
.fld input:focus,.fld textarea:focus{border-bottom-color:var(--ink)}
.fld input::placeholder,.fld textarea::placeholder{color:var(--paper3)}
.fld textarea{resize:vertical;min-height:52px;line-height:1.5}
.fld .autotag{display:none;font-size:9.5px;font-weight:850;color:var(--seal);background:var(--seal-soft);padding:1px 6px;border-radius:4px;letter-spacing:.04em}
.fld.has-auto .autotag{display:inline-block}
.fld input.auto,.fld textarea.auto{border-bottom-color:var(--seal)}
.status{display:none;margin-top:14px;padding:13px 15px;border-radius:15px;font-size:13px;line-height:1.55;background:var(--card);border:1px solid var(--line);color:var(--ink2)}
.status.show{display:block}
.status.err{background:#FBEDEA;border-color:var(--seal-line);color:var(--seal-deep)}
.status.ok{background:#EEF6F1;border-color:rgba(47,125,91,.28);color:#245F46}
.pbar{height:3px;border-radius:99px;background:var(--paper2);overflow:hidden;margin-top:10px}
.pbar i{display:block;height:100%;width:0;background:var(--ink);transition:width .25s ease}
.pbar.indet i{width:30%;animation:indet 1.1s ease-in-out infinite}
@keyframes indet{0%{transform:translateX(-110%)}100%{transform:translateX(340%)}}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--ink);border-radius:50%;vertical-align:-2px;margin-right:7px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ocrlines{margin-top:12px}
.ocrlines .hd{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:8px}
.ocrlines .wrapl{display:flex;flex-wrap:wrap;gap:6px;max-height:130px;overflow-y:auto}

.scanner .guide .c.tl{left:-2px;top:-2px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.scanner .guide .c.tr{right:-2px;top:-2px;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.scanner .guide .c.bl{left:-2px;bottom:-2px;border-right:0;border-top:0;border-radius:0 0 0 12px}
.scanner .guide .c.br{right:-2px;bottom:-2px;border-left:0;border-top:0;border-radius:0 0 12px 0}
.scanner .guide.ready .c{border-color:#FF6A4D}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}

<script>
'use strict';

try { CFG = Object.assign(CFG, JSON.parse(localStorage.getItem(LS_CFG) || '{}')); } catch(e){}

function esc(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); } // HTML 이스케이프

/* =========================================================
   E. 필터 / 목록 (ㄱㄴㄷ 색인)
   ========================================================= */
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const CHO_BASE = {'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ'};               // 쌍자음은 기본 자음으로
function indexKey(s){                                                            // 색인 글자
  const ch = String(s||'').trim()[0] || '#';
  const code = ch.charCodeAt(0);
  if (code >= 0xAC00 && code <= 0xD7A3){ const c = CHO[Math.floor((code - 0xAC00) / 588)]; return CHO_BASE[c] || c; }
  if (/[A-Za-z]/.test(ch)) return ch.toUpperCase();
  if (/[぀-ヿ一-鿿]/.test(ch)) return '漢';
  return '#';
}
function allTags(){ const s = new Set(); CARDS.forEach(c => (c.tags||[]).forEach(t => s.add(t))); return [...s]; }
function renderFilters(){
  const tags = allTags();
  filtersEl.innerHTML =
    `<button class="chip ${state.tag?'':'on'}" data-tag="">전체</button>` +
    tags.map(t=>`<button class="chip ${state.tag===t?'on':''}" data-tag="${esc(t)}">${esc(t)}</button>`).join('') +
    `<button class="chip sort" data-sort>${state.sort==='name'?'가나다순':state.sort==='company'?'회사별':'최근 추가'}</button>`;
  filtersEl.querySelectorAll('[data-tag]').forEach(b=>{ b.onclick = ()=>{ state.tag = b.dataset.tag || null; renderFilters(); render(); }; });
  filtersEl.querySelector('[data-sort]').onclick = ()=>{
    state.sort = state.sort==='name' ? 'company' : state.sort==='company' ? 'added' : 'name';
    renderFilters(); render();
  };
}
function filtered(){
  let arr = CARDS.filter(c=>{
    if (state.tag && !(c.tags||[]).includes(state.tag)) return false;
    if (!state.q) return true;
    const hay = [c.name,c.nameSub,c.title,c.company,c.companySub,c.email,c.address,(c.tags||[]).join(' '),
      ...(c.phones||[]).map(p=>p.number), ...(c.phones||[]).map(p=>telHref(p.number))].join(' ').toLowerCase();
    return state.q.toLowerCase().split(/\s+/).every(w=>hay.includes(w));
  });
  arr.sort((a,b)=>{
    if (state.sort==='company') return (a.company||'').localeCompare(b.company||'','ko') || (a.name||'').localeCompare(b.name||'','ko');
    if (state.sort==='added') return (b.added||'').localeCompare(a.added||'') || (a.name||'').localeCompare(b.name||'','ko');
    return (a.name||'').localeCompare(b.name||'','ko');
  });
  return arr;
}
function groupLabel(c){                                                          // 정렬 방식별 묶음 제목
  if (state.sort === 'company') return c.company || '회사 미입력';
  if (state.sort === 'added') return (c.added||'').slice(0,7).replace('-','. ') || '날짜 없음';
  return indexKey(c.name);
}
function thumbSrc(c){ if (c.imageData) return c.imageData; if (c.image) return c.image + '-thumb.webp'; return null; }
function miniCard(c){                                                            // 목록용 작은 명함
  const th = thumbSrc(c);
  if (th) return `<div class="mini"><img src="${esc(th)}" alt="" loading="lazy" onerror="this.parentNode.outerHTML=window.__genMini(this.parentNode.dataset.n)" ></div>`.replace('<div class="mini">', `<div class="mini" data-n="${esc(c.name||'')}">`);
  return genMini(c.name);
}
function genMini(n){ return `<div class="mini gen"><em>${esc(n||'')}</em><span><u></u><u></u></span><s></s></div>`; }
window.__genMini = genMini;
function render(){
  const arr = filtered();
  empty.style.display = arr.length ? 'none' : 'block';
  if (!arr.length){
    $('emptyTitle').textContent = CARDS.length ? '찾는 명함이 없어요' : '첫 명함을 스캔해 보세요';
    $('emptyDesc').innerHTML = CARDS.length ? '다른 이름이나 회사, 전화번호로 찾아보세요.' : '아래 빨간 버튼을 누르고 명함을 화면에 맞추면<br>자동으로 찍고 이름·회사·연락처를 채워 드려요.';
  }
  let html = '', last = null, i = 0;
  const counts = {};
  arr.forEach(c=>{ const g = groupLabel(c); counts[g] = (counts[g]||0) + 1; });
  arr.forEach(c=>{
    const g = groupLabel(c);
    if (g !== last){ html += `<div class="idx"><b>${esc(g)}</b><i></i><span>${counts[g]}</span></div>`; last = g; }
    const mob = (c.phones||[]).find(p=>p.type==='mobile') || (c.phones||[])[0];
    html += `<div class="row" data-id="${esc(c.id)}" style="animation-delay:${Math.min(i++,12)*22}ms">
      ${miniCard(c)}
      <div class="r-body">
        <div class="r-name">${esc(c.name)}${c.nameSub?`<small>${esc(c.nameSub)}</small>`:''}${c.mine?'<span class="r-tag">MY</span>':''}</div>
        <div class="r-meta">${c.company?`<b>${esc(c.company)}</b>`:''}${c.company&&c.title?' · ':''}${esc(c.title||'')}</div>
      </div>
      ${mob?`<a class="callbtn" href="tel:${telHref(mob.number)}" aria-label="전화">${ICON.phone}</a>`:''}
    </div>`;
  });
  book.innerHTML = html;
  book.querySelectorAll('.row').forEach(el=>{
    el.onclick = ()=>openDetail(el.dataset.id);
    el.querySelectorAll('.callbtn').forEach(a=>a.onclick = e=>e.stopPropagation());
  });
}

function downloadBlob(blob, name){                                               // 브라우저 다운로드
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 1500);
}
async function saveForDrive(c, fileName){
  toastMsg('사진을 준비하고 있어요…');
  try {
    let blob = null;
    if (c.imageData){ blob = await (await fetch(c.imageData)).blob(); }
    else if (c.image){
      try { const r = await fetch(c.image + '.jpg'); if (r.ok) blob = await r.blob(); } catch(e){}
      if (!blob){ const r2 = await fetch(c.image + '.webp'); if (r2.ok) blob = await r2.blob(); }
    }
    if (!blob){ toastMsg('저장할 명함 사진이 없어요'); return; }
    blob = await toJpegBlob(blob);                                               // 드라이브 규격(JPEG)
    if (NATIVE && NATIVE.shareOrSaveImage){                                      // APK: 사진 폴더 + 공유창
      const reader = new FileReader();
      reader.onloadend = () => { NATIVE.shareOrSaveImage(fileName, reader.result); toastMsg('공유창에서 "드라이브"를 선택하세요'); };
      reader.readAsDataURL(blob); return;
    }
    const file = new File([blob], fileName, { type:'image/jpeg', lastModified:Date.now() });
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      try { await navigator.share({ files:[file], title:fileName }); return; }
      catch(err){ if (err.name === 'AbortError') return; }
    }
    downloadBlob(blob, fileName); toastMsg(`'${fileName}' 사진을 내려받았어요`);
  } catch(err){ toastMsg('저장 실패: ' + (err.message||'알 수 없는 오류')); }
}
async function toJpegBlob(blob){                                                 // 어떤 이미지든 JPEG로
  if (blob.type === 'image/jpeg') return blob;
  const bmp = await createImageBitmap(blob);
  const cv = document.createElement('canvas'); cv.width = bmp.width; cv.height = bmp.height;
  const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,cv.width,cv.height); g.drawImage(bmp,0,0);
  return await new Promise(r=>cv.toBlob(r,'image/jpeg',0.9));
}
function vcf(c){
  const e = s => String(s||'').replace(/([,;\\])/g,'\\$1');                       // vCard 특수문자 이스케이프
  const p = t => (c.phones||[]).find(x=>x.type===t);
  const mobile = p('mobile'), tel = p('tel');
  return [
    'BEGIN:VCARD','VERSION:3.0', `N:${e(c.name)};;;;`, `FN:${e(c.name)}`,
    c.company ? `ORG:${e(c.company)}${c.companySub?';'+e(c.companySub):''}` : '',
    c.title ? `TITLE:${e(c.title)}` : '',
    mobile ? `TEL;TYPE=CELL,VOICE:${mobile.number}` : '',
    tel ? `TEL;TYPE=WORK,VOICE:${tel.number}` : '',
    c.fax ? `TEL;TYPE=WORK,FAX:${c.fax}` : '',
    c.email ? `EMAIL;TYPE=WORK:${c.email}` : '',
    c.website ? `URL:${c.website}` : '',
    c.address ? `ADR;TYPE=WORK:;;${e(c.address)}${c.addressDetail?' '+e(c.addressDetail):''};;;;` : '',
    'END:VCARD'
  ].filter(Boolean).join('\r\n');
}

/* =========================================================

   ========================================================= */
const SC = {                                                                     // 스캐너 상태
  stream:null, track:null, timer:null, raf:null,
  auto:true, portrait:false, torch:false,
  stableSince:0, prev:null, sharpMax:0, busy:false,
  goodSince:0, cardOk:false                                                      // 품질 OK 시작 시각, 명함 감지 여부
};
const scVideo = $('scVideo'), scGuide = $('scGuide'), scHint = $('scHint');
const RING_LEN = 220;                                                            // 셔터 진행 링 길이

function guideRect(){                                                            // 가이드 프레임 위치(px)
  const W = innerWidth, H = innerHeight;
  const ratio = SC.portrait ? 1/1.72 : 1.72;                                     // 명함 비율(90×52mm 근사)
  let w = Math.min(W * 0.88, 560), h = w / ratio;
  const maxH = H * 0.56;
  if (h > maxH){ h = maxH; w = h * ratio; }
  const x = (W - w) / 2, y = (H - h) / 2 - H * 0.03;
  return {x, y, w, h};
}
function layoutGuide(){                                                          // 가이드·안내 배치
  const g = guideRect();
  Object.assign(scGuide.style, {left:g.x+'px', top:g.y+'px', width:g.w+'px', height:g.h+'px'});
  scHint.style.top = (g.y + g.h + 18) + 'px';
  $('scMeters').style.top = (g.y - 40) + 'px';
}
async function openScanner(){
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){         // 카메라 API 미지원
    fileCamera.click(); return;
  }
  $('scanner').classList.add('open'); $('scanner').setAttribute('aria-hidden','false'); systemBars(true); // 카메라 화면은 검정 상단바
  document.body.style.overflow = 'hidden';
  layoutGuide(); setHint('카메라를 켜는 중…', false);
  try {
    SC.stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{ facingMode:{ideal:'environment'}, width:{ideal:2560}, height:{ideal:1440}, focusMode:'continuous' }
    });
  } catch(err){
    closeScanner();
    toastMsg('카메라 권한이 없어 기본 카메라로 전환해요', 3000);
    fileCamera.click(); return;
  }
  SC.track = SC.stream.getVideoTracks()[0];
  scVideo.srcObject = SC.stream;
  try { await scVideo.play(); } catch(e){}
  try {                                                                          // 연속 초점 시도 + 플래시 지원 확인
    const caps = SC.track.getCapabilities ? SC.track.getCapabilities() : {};
    if (caps.focusMode && caps.focusMode.includes('continuous')) await SC.track.applyConstraints({advanced:[{focusMode:'continuous'}]});
    $('scTorch').disabled = !caps.torch;
  } catch(e){ $('scTorch').disabled = true; }
  SC.stableSince = 0; SC.prev = null; SC.sharpMax = 0; SC.busy = false; SC.goodSince = 0; SC.cardOk = false;
  setRing(0);
  SC.timer = setInterval(analyzeFrame, 180);                                     // 0.18초마다 품질 분석
}
function closeScanner(){
  clearInterval(SC.timer); SC.timer = null;
  if (SC.stream) SC.stream.getTracks().forEach(t=>t.stop());
  SC.stream = null; SC.track = null; SC.torch = false;
  $('scTorch').classList.remove('on');
  scVideo.srcObject = null;
  $('scanner').classList.remove('open'); $('scanner').setAttribute('aria-hidden','true'); systemBars(false);
  if (!$('review').classList.contains('open')) document.body.style.overflow = '';
}
function setHint(t, ready){ scHint.textContent = t; scHint.classList.toggle('ready', !!ready); scGuide.classList.toggle('ready', !!ready); }
function setRing(p){ $('scRing').setAttribute('stroke-dashoffset', String(RING_LEN * (1 - Math.max(0,Math.min(1,p))))); }
function setMeter(id, good, label){ const el = $(id); el.className = 'meter ' + (good ? 'good' : 'bad'); if (label) el.textContent = label; }

/* 화면 좌표 → 비디오 원본 좌표 (object-fit:cover 보정) */
function screenToVideo(r){
  const vw = scVideo.videoWidth, vh = scVideo.videoHeight;
  const W = innerWidth, H = innerHeight;
  const s = Math.max(W / vw, H / vh);                                            // cover 배율
  const ox = (W - vw * s) / 2, oy = (H - vh * s) / 2;                            // 잘린 여백
  return { x:(r.x - ox) / s, y:(r.y - oy) / s, w:r.w / s, h:r.h / s };
}

const anaCv = document.createElement('canvas');                                 // 분석용 작은 캔버스
const anaCtx = anaCv.getContext('2d', { willReadFrequently:true });
function analyzeFrame(){
  if (SC.busy || !scVideo.videoWidth) return;
  const r = screenToVideo(guideRect());
  const AW = 180, AH = Math.round(AW * r.h / r.w);                               // 축소 분석 크기
  anaCv.width = AW; anaCv.height = AH;
  anaCtx.drawImage(scVideo, r.x, r.y, r.w, r.h, 0, 0, AW, AH);
  const d = anaCtx.getImageData(0, 0, AW, AH).data;
  const n = AW * AH, g = new Float32Array(n);
  let sum = 0;
  for (let i=0, j=0; i<n; i++, j+=4){ const v = d[j]*0.299 + d[j+1]*0.587 + d[j+2]*0.114; g[i] = v; sum += v; } // 흑백 변환
  const mean = sum / n;                                                          // 평균 밝기
  let lapSum = 0, lapSq = 0, cnt = 0;                                            // 라플라시안 분산 = 선명도
  for (let y=1; y<AH-1; y++) for (let x=1; x<AW-1; x++){
    const i = y*AW + x;
    const l = 4*g[i] - g[i-1] - g[i+1] - g[i-AW] - g[i+AW];
    lapSum += l; lapSq += l*l; cnt++;
  }
  const lm = lapSum / cnt, sharp = lapSq / cnt - lm*lm;
  let diff = 0;                                                                  // 이전 프레임과 차이 = 흔들림
  if (SC.prev && SC.prev.length === n){ for (let i=0; i<n; i+=3) diff += Math.abs(g[i] - SC.prev[i]); diff /= (n/3); }
  else diff = 99;
  SC.prev = g;
  SC.sharpMax = Math.max(SC.sharpMax * 0.985, sharp);                            // 최근 최고 선명도(서서히 감소)

  SC.cardOk = cardInGuide(r);                                                    // 프레임 안에 명함이 있는지
  const lightOk = mean > 70 && mean < 245;                                       // 밝기 적정
  const sharpOk = sharp > 55 && sharp >= SC.sharpMax * 0.62;                     // 충분히 선명
  const stableOk = diff < 5.5;                                                   // 흔들림 적음
  setMeter('mLight', lightOk, mean <= 70 ? '어두움' : mean >= 245 ? '반사' : '밝기');
  setMeter('mSharp', sharpOk, '초점');
  setMeter('mStable', stableOk, '고정');

  if (!(lightOk && stableOk && sharpOk)) SC.goodSince = 0;                       // 품질 나쁘면 대기 시간 초기화
  if (!lightOk){ setHint(mean <= 70 ? '조금 더 밝은 곳에서 찍어 주세요' : '빛 반사를 피해 각도를 바꿔 주세요', false); SC.stableSince = 0; setRing(0); return; }
  if (!stableOk){ setHint('휴대폰을 움직이지 말고 잠시 고정하세요', false); SC.stableSince = 0; setRing(0); return; }
  if (!sharpOk){ setHint('초점을 맞추는 중… 조금 더 가까이', false); SC.stableSince = 0; setRing(0); return; }

  const now = performance.now();
  if (!SC.goodSince) SC.goodSince = now;                                         // 품질 OK 지속 시간
  const cardReady = SC.cardOk || (now - SC.goodSince > 2600);                    // 감지 못해도 2.6초 후 허용
  if (!cardReady){ setHint('명함 네 모서리를 프레임에 맞춰 주세요', false); SC.stableSince = 0; setRing(0); return; }
  if (!SC.auto){ setHint('좋아요! 셔터를 누르세요', true); setRing(0); return; }
  if (!SC.stableSince) SC.stableSince = now;
  const p = (now - SC.stableSince) / 900;                                        // 0.9초 유지되면 자동 촬영
  setHint('그대로 유지하세요… 자동 촬영', true); setRing(p);
  if (p >= 1) captureFrame();
}
const cardCv = document.createElement('canvas');                                // 명함 감지용 캔버스
function cardInGuide(r){
  const mx = r.w * 0.12, my = r.h * 0.16;                                        // 프레임 바깥 여백 포함
  const sx = Math.max(0, r.x - mx), sy = Math.max(0, r.y - my);
  const ex = Math.min(scVideo.videoWidth, r.x + r.w + mx), ey = Math.min(scVideo.videoHeight, r.y + r.h + my);
  const W = 200, H = Math.max(2, Math.round(W * (ey - sy) / (ex - sx)));
  cardCv.width = W; cardCv.height = H;
  cardCv.getContext('2d', { willReadFrequently:true }).drawImage(scVideo, sx, sy, ex - sx, ey - sy, 0, 0, W, H);
  const q = detectCardQuad(cardCv);
  if (!q) return false;
  const k = (ex - sx) / W;                                                       // 감지 좌표 → 비디오 좌표
  const area = Math.abs(polyArea(q)) * k * k, guideArea = r.w * r.h;
  const ratio = area / guideArea;
  return ratio > 0.55 && ratio < 1.35;                                           // 프레임 크기와 비슷하면 OK
}
async function captureFrame(){
  if (SC.busy || !scVideo.videoWidth) return;
  SC.busy = true;
  $('scFlash').classList.remove('go'); void $('scFlash').offsetWidth; $('scFlash').classList.add('go'); // 촬영 효과
  if (navigator.vibrate) navigator.vibrate(30);
  const g = screenToVideo(guideRect());
  const mx = g.w * 0.07, my = g.h * 0.09;                                        // 프레임 바깥 여유(모서리 조정용)
  const sx = Math.max(0, g.x - mx), sy = Math.max(0, g.y - my);
  const ex = Math.min(scVideo.videoWidth, g.x + g.w + mx), ey = Math.min(scVideo.videoHeight, g.y + g.h + my);
  const cv = document.createElement('canvas');
  cv.width = Math.round(ex - sx); cv.height = Math.round(ey - sy);
  cv.getContext('2d').drawImage(scVideo, sx, sy, ex - sx, ey - sy, 0, 0, cv.width, cv.height); // 원본 해상도로 자르기
  const quad = [                                                                 // 가이드 프레임의 네 모서리(자른 이미지 기준)
    {x:g.x - sx, y:g.y - sy}, {x:g.x + g.w - sx, y:g.y - sy},
    {x:g.x + g.w - sx, y:g.y + g.h - sy}, {x:g.x - sx, y:g.y + g.h - sy}
  ];
  const detected = detectCardQuad(cv, true);                                     // 테두리 정밀 감지
  closeScanner();
  openReview(cv, detected || quad, 'camera');
}
$('scClose').onclick = closeScanner;
$('scShutter').onclick = ()=>captureFrame();
$('scAlbum').onclick = ()=>{ closeScanner(); fileAlbum.click(); };
$('scAuto').onclick = ()=>{
  SC.auto = !SC.auto;
  $('scAuto').classList.toggle('on', SC.auto); $('scShutter').classList.toggle('auto', SC.auto);
  $('scAutoTxt').textContent = SC.auto ? '자동' : '수동';
  SC.stableSince = 0; setRing(0);
  toastMsg(SC.auto ? '자동 촬영 켜짐' : '자동 촬영 꺼짐 — 셔터를 직접 누르세요', 1600);
};
$('scTorch').onclick = async ()=>{
  if (!SC.track) return;
  SC.torch = !SC.torch;
  try { await SC.track.applyConstraints({ advanced:[{ torch:SC.torch }] }); $('scTorch').classList.toggle('on', SC.torch); }
  catch(e){ SC.torch = false; toastMsg('이 기기는 플래시 제어를 지원하지 않아요'); }
};
$('scOrient').onclick = ()=>{                                                     // 가로/세로 명함 프레임 전환
  SC.portrait = !SC.portrait; layoutGuide(); SC.stableSince = 0; SC.sharpMax = 0;
  $('scOrient').textContent = SC.portrait ? '▯ 세로 명함' : '▭ 가로 명함';
};
addEventListener('resize', ()=>{ if ($('scanner').classList.contains('open')) layoutGuide(); });

/* =========================================================
   I. 명함 테두리 정밀 감지 (흰색 판별 + 네 변 직선 맞춤 + 원본 해상도 보정)
   ========================================================= */
/**
 * 명함 네 모서리 찾기
 * 1) 축소 이미지에서 "밝고 색이 없는(흰색)" 정도로 명함 영역 분리 (실패 시 밝기만으로 재시도)
 * 2) 가운데에서 가장 큰 덩어리 → 바깥 경계점 추출
 * 3) 경계점을 네 변으로 나눠 직선 맞춤 → 직선 교점 = 모서리
 * 4) (refine=true) 원본 해상도에서 경계선 위치를 다시 찾아 1~2px 수준으로 보정
 * 반환: [좌상, 우상, 우하, 좌하] (원본 좌표) 또는 null
 */
function detectCardQuad(src, refine){
  try {
    const S = refine ? 480 : 240;                                                // 축소 크기 (실시간 분석은 작게)
    const sc = Math.min(1, S / Math.max(src.width, src.height));
    const w = Math.max(8, Math.round(src.width * sc)), h = Math.max(8, Math.round(src.height * sc));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d', { willReadFrequently:true });
    ctx.drawImage(src, 0, 0, w, h);
    const d = ctx.getImageData(0, 0, w, h).data, n = w*h;
    const white = new Float32Array(n), bright = new Float32Array(n);
    for (let i=0, j=0; i<n; i++, j+=4){
      const r = d[j], g = d[j+1], b = d[j+2];
      const mx = Math.max(r,g,b), mn = Math.min(r,g,b);
      const sat = mx ? (mx - mn) / mx : 0;                                        // 채도(0=무채색)
      bright[i] = r*0.299 + g*0.587 + b*0.114;                                    // 밝기
      white[i] = mx * (1 - Math.min(1, sat * 1.8));                               // 흰색 점수: 밝고 무채색일수록 큼
    }
    let quad = quadFromScore(white, w, h) || quadFromScore(bright, w, h);        // 흰색 기준 → 실패 시 밝기 기준
    if (!quad) return null;
    quad = quad.map(p=>({ x:p.x / sc, y:p.y / sc }));                             // 원본 좌표로
    if (refine) quad = refineQuadFullRes(src, quad) || quad;                     // 원본 해상도 미세 보정
    if (!isGoodQuad(quad, src.width, src.height)) return null;
    return quad;
  } catch(e){ return null; }
}

/* 점수 맵 → 명함 사각형: 임계값을 단계적으로 올려 가며 시도 (흰 책상 위 흰 명함 대응) */
function quadFromScore(score, w, h){
  let lo = -1;
  for (let k=0; k<3; k++){
    const thr = otsu(score, lo);                                                 // 이전 임계값보다 밝은 쪽에서 다시 나누기
    if (thr <= lo) break;
    const q = quadAtThreshold(score, w, h, thr);
    if (q) return q;
    lo = thr;
  }
  return null;
}
function quadAtThreshold(score, w, h, thr){
  const mask = new Uint8Array(w*h);
  for (let i=0;i<mask.length;i++) mask[i] = score[i] > thr ? 1 : 0;
  // 가운데 부근에서 가장 큰 덩어리 (플러드필)
  const seen = new Uint8Array(w*h); let comp = null, compN = 0;
  const cx = w>>1, cy = h>>1;
  const seeds = [[cx,cy],[cx-(w/6|0),cy],[cx+(w/6|0),cy],[cx,cy-(h/6|0)],[cx,cy+(h/6|0)],[cx-(w/4|0),cy-(h/5|0)],[cx+(w/4|0),cy+(h/5|0)]];
  for (const [sx, sy] of seeds){
    const s0 = sy*w + sx; if (!mask[s0] || seen[s0]) continue;
    const lab = new Uint8Array(w*h), stack = [s0]; seen[s0] = 1; lab[s0] = 1; let cnt = 0;
    while (stack.length){
      const p = stack.pop(); cnt++; const x = p % w, y = (p / w) | 0;
      if (x>0 && mask[p-1] && !seen[p-1]){ seen[p-1]=1; lab[p-1]=1; stack.push(p-1); }
      if (x<w-1 && mask[p+1] && !seen[p+1]){ seen[p+1]=1; lab[p+1]=1; stack.push(p+1); }
      if (y>0 && mask[p-w] && !seen[p-w]){ seen[p-w]=1; lab[p-w]=1; stack.push(p-w); }
      if (y<h-1 && mask[p+w] && !seen[p+w]){ seen[p+w]=1; lab[p+w]=1; stack.push(p+w); }
    }
    if (cnt > compN){ compN = cnt; comp = lab; }
  }
  if (!comp) return null;
  const area = compN / (w*h);
  if (area < 0.12 || area > 0.985) return null;                                  // 너무 작거나 화면 전체면 실패

  // 바깥 경계점: 각 행의 좌·우 끝, 각 열의 위·아래 끝 (글자 구멍은 무시됨)
  const pts = [];
  for (let y=0;y<h;y++){ let l=-1, r=-1; for (let x=0;x<w;x++) if (comp[y*w+x]){ if (l<0) l=x; r=x; } if (l>=0){ pts.push({x:l,y,edge:l===0}); pts.push({x:r,y,edge:r===w-1}); } }
  for (let x=0;x<w;x++){ let t=-1, b=-1; for (let y=0;y<h;y++) if (comp[y*w+x]){ if (t<0) t=y; b=y; } if (t>=0){ pts.push({x,y:t,edge:t===0}); pts.push({x,y:b,edge:b===h-1}); } }
  const edgeFrac = pts.filter(p=>p.edge).length / pts.length;                   // 사진 테두리에 닿은 비율
  if (edgeFrac > 0.3) return null;                                               // 배경까지 한 덩어리 → 더 밝은 임계값으로
  // 대략적인 모서리: x+y, x−y 극값
  let tl, tr, br, bl, a=1e9, b2=-1e9, c2=-1e9, d2=1e9;
  for (const p of pts){ const s = p.x + p.y, df = p.x - p.y;
    if (s < a){ a = s; tl = p; } if (s > b2){ b2 = s; br = p; }
    if (df > c2){ c2 = df; tr = p; } if (df < d2){ d2 = df; bl = p; } }
  let quad = [tl,tr,br,bl].map(p=>({x:p.x+0.5, y:p.y+0.5}));
  // 네 변 직선 맞춤 (둥근 모서리 영향을 줄이려 변 가운데 70%만 사용)
  const diag = Math.hypot(w, h), tol = diag * 0.035;
  const lines = [];
  for (let k=0;k<4;k++){
    const A = quad[k], B = quad[(k+1)%4];
    const vx = B.x - A.x, vy = B.y - A.y, L = Math.hypot(vx, vy) || 1;
    const ux = vx / L, uy = vy / L;
    const sel = pts.filter(p=>{
      if (p.edge) return false;                                                  // 사진 가장자리에 닿은 점 제외
      const t = ((p.x - A.x)*ux + (p.y - A.y)*uy) / L;                            // 변 위 위치(0~1)
      const dist = Math.abs((p.x - A.x)*uy - (p.y - A.y)*ux);                     // 변에서 떨어진 거리
      return t > 0.15 && t < 0.85 && dist < tol;
    });
    lines.push(sel.length >= 6 ? fitLine(sel) : null);
  }
  const refined = [];
  for (let k=0;k<4;k++){                                                         // 모서리 k = 변(k-1)과 변 k의 교점
    const L1 = lines[(k+3)%4], L2 = lines[k];
    const p = (L1 && L2) ? intersect(L1, L2) : null;
    refined.push(p && Math.hypot(p.x - quad[k].x, p.y - quad[k].y) < diag*0.12 ? p : quad[k]);
  }
  quad = refined;
  const qa = Math.abs(polyArea(quad)) / (w*h);
  if (qa < area * 0.8 || qa > area * 1.25) return null;                          // 덩어리와 사각형이 안 맞으면 실패
  return quad;
}

/* 원본 해상도에서 각 변을 경계 기울기 최대 지점으로 다시 맞춤 */
function refineQuadFullRes(src, quad){
  const W = src.width, H = src.height;
  const g = src.getContext ? src.getContext('2d', { willReadFrequently:true }) : null;
  if (!g) return null;
  const data = g.getImageData(0, 0, W, H).data;
  const lum = (x, y)=>{ x = Math.max(0, Math.min(W-1, x|0)); y = Math.max(0, Math.min(H-1, y|0)); const i = (y*W + x)*4; return data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114; };
  const cx = quad.reduce((s,p)=>s+p.x,0)/4, cy = quad.reduce((s,p)=>s+p.y,0)/4;   // 사각형 중심
  const R = Math.max(6, Math.round(Math.max(W, H) * 0.012));                     // 탐색 반경(px)
  const lines = [];
  for (let k=0;k<4;k++){
    const A = quad[k], B = quad[(k+1)%4];
    const vx = B.x - A.x, vy = B.y - A.y, L = Math.hypot(vx, vy) || 1;
    let nx = vy / L, ny = -vx / L;                                               // 변의 법선
    const mx = (A.x + B.x)/2, my = (A.y + B.y)/2;
    if ((cx - mx)*nx + (cy - my)*ny < 0){ nx = -nx; ny = -ny; }                  // 법선이 안쪽(명함)을 향하도록
    const pts = [];
    for (let s=1; s<=24; s++){
      const t = 0.12 + 0.76 * s / 25;                                            // 변 가운데 부분만
      const px = A.x + vx*t, py = A.y + vy*t;
      let best = 0, bestOff = null;
      for (let o=-R; o<=R; o++){                                                 // 바깥(어두움) → 안쪽(밝음) 변화가 가장 큰 곳
        const inner = lum(px + nx*(o+2), py + ny*(o+2)) + lum(px + nx*(o+3), py + ny*(o+3));
        const outer = lum(px + nx*(o-2), py + ny*(o-2)) + lum(px + nx*(o-3), py + ny*(o-3));
        const grad = inner - outer;
        if (grad > best){ best = grad; bestOff = o; }
      }
      if (bestOff !== null && best > 30) pts.push({ x:px + nx*bestOff, y:py + ny*bestOff });
    }
    lines.push(pts.length >= 8 ? fitLine(pts) : null);
  }
  const out = [];
  for (let k=0;k<4;k++){
    const L1 = lines[(k+3)%4], L2 = lines[k];
    const p = (L1 && L2) ? intersect(L1, L2) : null;
    out.push(p && Math.hypot(p.x - quad[k].x, p.y - quad[k].y) < R*3 ? p : quad[k]);
  }
  return out;
}

/* 점들에 직선 맞춤 (주성분 방향) → {px,py,dx,dy} */
function fitLine(pts){
  let sx=0, sy=0; for (const p of pts){ sx+=p.x; sy+=p.y; }
  const mx = sx/pts.length, my = sy/pts.length;
  let xx=0, xy=0, yy=0; for (const p of pts){ const dx=p.x-mx, dy=p.y-my; xx+=dx*dx; xy+=dx*dy; yy+=dy*dy; }
  const ang = 0.5 * Math.atan2(2*xy, xx - yy);
  return { px:mx, py:my, dx:Math.cos(ang), dy:Math.sin(ang) };
}
/* 두 직선의 교점 */
function intersect(a, b){
  const den = a.dx*b.dy - a.dy*b.dx; if (Math.abs(den) < 1e-6) return null;
  const t = ((b.px - a.px)*b.dy - (b.py - a.py)*b.dx) / den;
  return { x:a.px + a.dx*t, y:a.py + a.dy*t };
}
/* 볼록하고 각도가 자연스러운 사각형인지 검사 */
function isGoodQuad(q, W, H){
  const qa = Math.abs(polyArea(q)) / (W*H);
  if (qa < 0.1 || qa > 0.995) return false;
  let sign = 0;
  for (let i=0;i<4;i++){
    const a = q[i], b = q[(i+1)%4], c = q[(i+2)%4];
    const cr = (b.x-a.x)*(c.y-b.y) - (b.y-a.y)*(c.x-b.x);
    if (!sign) sign = Math.sign(cr); else if (Math.sign(cr) !== sign) return false; // 볼록성
    const v1x = a.x-b.x, v1y = a.y-b.y, v2x = c.x-b.x, v2y = c.y-b.y;
    const cos = (v1x*v2x + v1y*v2y) / (Math.hypot(v1x,v1y)*Math.hypot(v2x,v2y) || 1);
    if (Math.abs(cos) > 0.6) return false;                                       // 모서리 각도 53~127° 범위
  }
  return true;
}
function otsu(arr, above){                                                       // 오츠 자동 임계값 (above보다 큰 값만 대상)
  const lo = above == null ? -1 : above;
  const hist = new Float64Array(256); let total = 0;
  for (let i=0;i<arr.length;i++){ const v = arr[i]; if (v > lo){ hist[Math.max(0, Math.min(255, v|0))]++; total++; } }
  if (!total) return lo;
  let sumAll = 0; for (let t=0;t<256;t++) sumAll += t*hist[t];
  let sumB = 0, wB = 0, best = 0, thr = 128;
  for (let t=0;t<256;t++){ wB += hist[t]; if (!wB) continue; const wF = total - wB; if (!wF) break; sumB += t*hist[t];
    const mB = sumB/wB, mF = (sumAll-sumB)/wF, bt = wB*wF*(mB-mF)*(mB-mF); if (bt > best){ best = bt; thr = t; } }
  return thr;
}
function polyArea(q){ let s = 0; for (let i=0;i<q.length;i++){ const a=q[i], b=q[(i+1)%q.length]; s += a.x*b.y - b.x*a.y; } return s/2; }

/* 보정 후 가장자리에 남은 배경 띠 자르기 (흰 명함 기준) */
function trimEdges(cv){
  const W = cv.width, H = cv.height;
  const d = cv.getContext('2d', { willReadFrequently:true }).getImageData(0, 0, W, H).data;
  const isPaper = new Uint8Array(W*H); let sumV = 0, cnt = 0;
  const cx0 = W*0.3|0, cx1 = W*0.7|0, cy0 = H*0.3|0, cy1 = H*0.7|0;
  for (let y=cy0;y<cy1;y+=3) for (let x=cx0;x<cx1;x+=3){ const i=(y*W+x)*4; sumV += Math.max(d[i],d[i+1],d[i+2]); cnt++; }
  const paperV = sumV / cnt;                                                     // 명함 바탕 밝기 추정
  if (paperV < 120) return cv;                                                   // 어두운 명함은 건너뜀
  for (let i=0, j=0; i<W*H; i++, j+=4){
    const mx = Math.max(d[j],d[j+1],d[j+2]), mn = Math.min(d[j],d[j+1],d[j+2]);
    isPaper[i] = (mx > paperV*0.72 && (mx - mn) < 60) ? 1 : 0;                   // 바탕과 비슷한 밝은 무채색
  }
  const rowFrac = y=>{ let s=0; for (let x=0;x<W;x+=2) s+=isPaper[y*W+x]; return s/(W/2); };
  const colFrac = x=>{ let s=0; for (let y=0;y<H;y+=2) s+=isPaper[y*W+x]; return s/(H/2); };
  const maxY = H*0.06|0, maxX = W*0.06|0;                                        // 최대 6%까지만 자르기
  let top=0, bot=H-1, lef=0, rig=W-1;
  while (top < maxY && rowFrac(top) < 0.55) top++;
  while (H-1-bot < maxY && rowFrac(bot) < 0.55) bot--;
  while (lef < maxX && colFrac(lef) < 0.55) lef++;
  while (W-1-rig < maxX && colFrac(rig) < 0.55) rig--;
  if (top===0 && lef===0 && bot===H-1 && rig===W-1) return cv;
  const out = document.createElement('canvas'); out.width = rig-lef+1; out.height = bot-top+1;
  out.getContext('2d').drawImage(cv, lef, top, out.width, out.height, 0, 0, out.width, out.height);
  return out;
}

/* 표준 명함 비율에 가까우면 그 비율로 맞춤 (원근 때문에 찌그러진 모양 보정) */
const CARD_RATIOS = [1.8, 1.75, 1.655, 1.636, 1.586];                            // 90×50, 3.5×2in, 91×55, 90×55, 85.6×54
function snapAspect(cv){
  const land = cv.width >= cv.height, r = land ? cv.width/cv.height : cv.height/cv.width;
  let best = null, bd = 1;
  for (const s of CARD_RATIOS){ const dd = Math.abs(r - s) / s; if (dd < bd){ bd = dd; best = s; } }
  if (!best || bd > 0.06 || bd < 0.004) return cv;                               // 6% 이상 차이나면 손대지 않음
  const out = document.createElement('canvas');
  if (land){ out.width = cv.width; out.height = Math.round(cv.width / best); }
  else { out.height = cv.height; out.width = Math.round(cv.height / best); }
  const g = out.getContext('2d'); g.imageSmoothingQuality = 'high';
  g.drawImage(cv, 0, 0, out.width, out.height);
  return out;
}

/* 반듯하게 편 결과 마무리: 가장자리 다듬기 + 비율 맞춤 */
function finishWarp(cv){ return snapAspect(trimEdges(cv)); }

/* 이미 잘린 이미지(구글 스캐너 결과 등)를 한 번 더 정밀하게 맞춤 */
async function tightenImage(dataUrl){
  try {
    const img = await new Promise((ok, no)=>{ const im = new Image(); im.onload = ()=>ok(im); im.onerror = no; im.src = dataUrl; });
    const cv = document.createElement('canvas'); cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    cv.getContext('2d').drawImage(img, 0, 0);
    let out = cv;
    const q = detectCardQuad(cv, true);
    if (q){
      const ratio = Math.abs(polyArea(q)) / (cv.width*cv.height);
      if (ratio > 0.5 && ratio < 0.97) out = warpPerspective(cv, q, Math.max(cv.width, cv.height)); // 배경이 꽤 남았으면 다시 펴기
    }
    out = finishWarp(out);
    if (out === cv) return dataUrl;                                              // 바뀐 게 없으면 원본
    return out.toDataURL('image/jpeg', 0.9);
  } catch(e){ return dataUrl; }
}

function buildHandles(){
  rvWrap.querySelectorAll('.handle').forEach(h=>h.remove());
  RV.quad.forEach((p, i)=>{
    const h = document.createElement('div'); h.className = 'handle'; h.dataset.i = i;
    rvWrap.appendChild(h);
    h.addEventListener('pointerdown', ev=>{
      ev.preventDefault(); h.setPointerCapture(ev.pointerId);
      const move = e=>{
        const r = rvCanvas.getBoundingClientRect();
        const k = RV.src.width / r.width;                                        // 표시 → 원본 배율
        RV.quad[i].x = Math.max(0, Math.min(RV.src.width, (e.clientX - r.left) * k));
        RV.quad[i].y = Math.max(0, Math.min(RV.src.height, (e.clientY - r.top) * k));
        placeHandles();
      };
      const up = ()=>{ h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up); };
      h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
    });
  });

}
function placeHandles(){                                                         // 점·다각형 그리기

/* 원근 보정: 네 점(좌상·우상·우하·좌하) → 직사각형 */
function warpPerspective(src, q, longSide){
  const dist = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y);
  let W = Math.max(dist(q[0],q[1]), dist(q[3],q[2]));                             // 결과 가로
  let H = Math.max(dist(q[0],q[3]), dist(q[1],q[2]));                             // 결과 세로
  const k = longSide / Math.max(W, H); W = Math.round(W*k); H = Math.round(H*k);
  const Hm = homography([{x:0,y:0},{x:W,y:0},{x:W,y:H},{x:0,y:H}], q);           // 결과 → 원본 변환행렬
  const sctx = src.getContext('2d', { willReadFrequently:true });
  const sd = sctx.getImageData(0, 0, src.width, src.height), s = sd.data, sw = src.width, sh = src.height;
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const octx = out.getContext('2d'); const od = octx.createImageData(W, H), o = od.data;
  for (let y=0; y<H; y++){
    for (let x=0; x<W; x++){
      const den = Hm[6]*x + Hm[7]*y + 1;
      let u = (Hm[0]*x + Hm[1]*y + Hm[2]) / den, v = (Hm[3]*x + Hm[4]*y + Hm[5]) / den;
      u = Math.max(0, Math.min(sw-1.001, u)); v = Math.max(0, Math.min(sh-1.001, v));
      const x0 = u|0, y0 = v|0, fx = u-x0, fy = v-y0;                            // 쌍선형 보간
      const i00 = (y0*sw + x0)*4, i10 = i00+4, i01 = i00 + sw*4, i11 = i01+4;
      const oi = (y*W + x)*4;
      for (let c=0; c<3; c++){
        o[oi+c] = (s[i00+c]*(1-fx) + s[i10+c]*fx)*(1-fy) + (s[i01+c]*(1-fx) + s[i11+c]*fx)*fy;
      }
      o[oi+3] = 255;
    }
  }
  octx.putImageData(od, 0, 0);
  return out;
}
function homography(from, to){                                                   // 4점 대응 → 3x3 행렬(8개 값)
  const A = [], b = [];
  for (let i=0;i<4;i++){
    const {x,y} = from[i], {x:u,y:v} = to[i];
    A.push([x,y,1,0,0,0,-u*x,-u*y]); b.push(u);
    A.push([0,0,0,x,y,1,-v*x,-v*y]); b.push(v);
  }
  return solve(A, b);
}
function solve(A, b){                                                            // 가우스 소거법
  const n = b.length;
  for (let i=0;i<n;i++){
    let p = i; for (let r=i+1;r<n;r++) if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r;
    [A[i],A[p]] = [A[p],A[i]]; [b[i],b[p]] = [b[p],b[i]];
    if (Math.abs(A[i][i]) < 1e-12) throw new Error('모서리 점이 한 줄에 있어요');
    for (let r=i+1;r<n;r++){ const f = A[r][i]/A[i][i]; for (let c=i;c<n;c++) A[r][c] -= f*A[i][c]; b[r] -= f*b[i]; }
  }
  const xs = new Array(n);
  for (let i=n-1;i>=0;i--){ let s = b[i]; for (let c=i+1;c<n;c++) s -= A[i][c]*xs[c]; xs[i] = s/A[i][i]; }
  return xs;
}

/* 필터: color(자동 레벨), scan(그림자 제거+선명), bw(문서 흑백) */
const FILTER_CACHE = new WeakMap();
function applyFilter(src, mode){
  let cache = FILTER_CACHE.get(src); if (!cache){ cache = {}; FILTER_CACHE.set(src, cache); }
  if (cache[mode]) return cache[mode];
  const w = src.width, h = src.height;
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  const ctx = out.getContext('2d', { willReadFrequently:true });
  ctx.drawImage(src, 0, 0);
  const id = ctx.getImageData(0, 0, w, h), d = id.data, n = w*h;
  if (mode === 'color'){
    for (let c=0;c<3;c++){                                                       // 채널별 1%~99% 늘이기
      const hist = new Uint32Array(256); for (let i=c;i<d.length;i+=4) hist[d[i]]++;
      let lo=0, hi=255, acc=0; while (acc + hist[lo] < n*0.01 && lo<254){ acc += hist[lo]; lo++; }
      acc=0; while (acc + hist[hi] < n*0.01 && hi>1){ acc += hist[hi]; hi--; }
      const span = Math.max(1, hi-lo);
      for (let i=c;i<d.length;i+=4) d[i] = Math.max(0, Math.min(255, (d[i]-lo)*255/span));
    }
  } else {
    const g = new Float32Array(n);
    for (let i=0,j=0;i<n;i++,j+=4) g[i] = d[j]*0.299 + d[j+1]*0.587 + d[j+2]*0.114; // 흑백
    const bg = backgroundMap(g, w, h);                                           // 조명/그림자 추정
    const norm = new Float32Array(n);
    for (let i=0;i<n;i++) norm[i] = Math.min(1.2, g[i] / Math.max(24, bg[i]));    // 배경으로 나눠 그림자 제거
    if (mode === 'scan'){
      for (let i=0,j=0;i<n;i++,j+=4){
        let v = norm[i]; v = (v - 0.28) / (0.95 - 0.28);                           // 대비 강화
        v = Math.max(0, Math.min(1, v)); v = Math.pow(v, 1.35);                     // 글자 진하게
        const p = v*255; d[j]=d[j+1]=d[j+2]=p;
      }
    } else {                                                                     // bw: 지역 적응형 이진화
      for (let i=0,j=0;i<n;i++,j+=4){ const p = norm[i] < 0.78 ? 0 : 255; d[j]=d[j+1]=d[j+2]=p; }
    }
  }
  ctx.putImageData(id, 0, 0);
  cache[mode] = out;
  return out;
}
function backgroundMap(g, w, h){                                                 // 큰 블러로 배경 밝기 추정
  const f = 8, sw = Math.max(1, Math.ceil(w/f)), sh = Math.max(1, Math.ceil(h/f));
  const small = new Float32Array(sw*sh);
  for (let y=0;y<sh;y++) for (let x=0;x<sw;x++){                                  // 블록별 상위 밝기(종이 색)
    let mx = 0; for (let yy=y*f; yy<Math.min(h,(y+1)*f); yy+=2) for (let xx=x*f; xx<Math.min(w,(x+1)*f); xx+=2){ const v = g[yy*w+xx]; if (v>mx) mx=v; }
    small[y*sw+x] = mx;
  }
  const blur = boxBlur(boxBlur(small, sw, sh, 3), sw, sh, 3);                    // 두 번 블러
  const out = new Float32Array(w*h);
  for (let y=0;y<h;y++){ const sy = Math.min(sh-1, (y/f)|0); for (let x=0;x<w;x++) out[y*w+x] = blur[sy*sw + Math.min(sw-1,(x/f)|0)]; }
  return out;
}
function boxBlur(a, w, h, r){
  const t = new Float32Array(w*h), o = new Float32Array(w*h);
  for (let y=0;y<h;y++){ let s=0, c=0; for (let x=-r;x<w;x++){ if (x+r<w){ s+=a[y*w+x+r]; c++; } if (x-r-1>=0){ s-=a[y*w+x-r-1]; c--; } if (x>=0) t[y*w+x]=s/c; } }
  for (let x=0;x<w;x++){ let s=0, c=0; for (let y=-r;y<h;y++){ if (y+r<h){ s+=t[(y+r)*w+x]; c++; } if (y-r-1>=0){ s-=t[(y-r-1)*w+x]; c--; } if (y>=0) o[y*w+x]=s/c; } }
  return o;
}
function canvasToDataUrl(cv, maxW, maxBytes){                                    // 저장용 압축
  let c = cv;
  if (cv.width > maxW){ c = document.createElement('canvas'); c.width = maxW; c.height = Math.round(cv.height * maxW / cv.width); c.getContext('2d').drawImage(cv, 0, 0, c.width, c.height); }
  let q = 0.85, out = c.toDataURL('image/webp', q);
  const isWebp = out.startsWith('data:image/webp');
  if (!isWebp) out = c.toDataURL('image/jpeg', q);
  while (out.length > maxBytes*1.37 && q > 0.45){ q -= 0.1; out = c.toDataURL(isWebp ? 'image/webp' : 'image/jpeg', q); }
  return out;
}

/* 폼 채우기: 비어 있는 칸 우선 / 'soft'면 자동값만 덮어쓰기 / true면 모두 덮어쓰기 */
function fillForm(j, override){
  const set = (id, val)=>{
    const el = $('f_'+id); if (!el || val == null) return;
    const s = String(val).trim(); if (!s || s === 'null') return;
    if (el.value.trim() && !override) return;
    if (el.value.trim() && override === 'soft' && !el.classList.contains('auto')) return; // 사용자가 쓴 값 보존
    el.value = s; el.classList.add('auto'); el.closest('.fld').classList.add('has-auto');
  };
  FIELDS.forEach(k=>set(k, j[k]));
  if (Array.isArray(j.tags) && j.tags.length) set('tags', j.tags.join(', '));
}

/* =========================================================
   L. 인식 파이프라인: (AI) → 기기 내 OCR → Tesseract
   ========================================================= */
async function recognize({display, ocrImage, ocr, el}){
  const bar = '<div class="pbar indet" id="ocrBar"><i></i></div>';
  let ocrRes = ocr;
  try {
    if (!ocrRes){                                                                // OCR 먼저 (빠르고 오프라인)
      setAIStatus(el, `<span class="spin"></span>${HAS_NATIVE_OCR?'기기 내 한글 OCR로':'무료 OCR로'} 글자를 읽는 중…${bar}`);
      ocrRes = await runOCREngine(ocrImage, p=>{ const b = $('ocrBar'); if (b){ b.classList.remove('indet'); b.firstChild.style.width = Math.round(p*100)+'%'; } });
    }
  } catch(err){ ocrRes = null; console.warn('OCR 실패', err); }

  let fields = {}, filledCount = 0;
  if (ocrRes && ocrRes.text && ocrRes.text.trim()){
    fields = extractFields(ocrRes.text, ocrRes.lines || []);                       // 이름·회사·연락처 추정
    fillForm(fields, false);
    filledCount = Object.values(fields).filter(Boolean).length;
  }

  if (CFG.key){                                                                  // AI 키가 있으면 AI로 보강
    setAIStatus(el, `<span class="spin"></span>AI가 명함을 정밀하게 읽는 중…${bar}`);
    try {
      const j = await aiParse(display);
      fillForm(j, 'soft');
      setAIStatus(el, '✅ AI 인식 완료 — 골드 표시 칸을 확인하세요.' + linesHtml(ocrRes), false, true);
      bindLines(ocrRes); return;
    } catch(err){
      console.warn('AI 실패 → OCR 결과 사용', err);
      if (filledCount){ setAIStatus(el, '⚠️ AI 연결 실패로 OCR 결과만 채웠어요. 골드 표시 칸을 확인하세요.' + linesHtml(ocrRes), true); bindLines(ocrRes); return; }
    }
  }

  if (!ocrRes || !ocrRes.text || !ocrRes.text.trim()){
    setAIStatus(el, '⚠️ 글자를 읽지 못했어요. 밝은 곳에서 다시 스캔하거나 직접 입력하세요.', true); return;
  }
  const engine = ocrRes.engine || 'OCR';
  setAIStatus(el, `✅ ${esc(engine)} 인식 완료 — ${filledCount}개 칸을 채웠어요. 아래 인식된 줄을 탭하면 선택한 칸에 들어가요.` + linesHtml(ocrRes), false, true);
  bindLines(ocrRes);
}
function setAIStatus(el, html, isErr, ok){
  el.classList.add('show'); el.classList.toggle('err', !!isErr); el.classList.toggle('ok', !!ok && !isErr); el.innerHTML = html;
}
function linesHtml(ocrRes){                                                      // 인식된 줄 칩
  if (!ocrRes || !ocrRes.text) return '';
  const lines = splitLines(ocrRes);
  if (!lines.length) return '';
  return `<div class="ocrlines"><div class="hd">인식된 줄 — 칸을 먼저 누르고 줄을 탭하세요</div><div class="wrapl">${
    lines.map((t,i)=>`<button class="oline" data-i="${i}">${esc(t)}</button>`).join('')}</div></div>`;
}
function splitLines(ocrRes){
  const arr = (ocrRes.lines && ocrRes.lines.length) ? ocrRes.lines.map(l=>l.text) : ocrRes.text.split(/\n+/);
  return arr.map(s=>String(s).trim()).filter(s=>s.length > 1).slice(0, 40);
}
function bindLines(ocrRes){
  if (!ocrRes) return;
  const lines = splitLines(ocrRes);
  panel.querySelectorAll('.oline').forEach(b=>b.onclick = ()=>{
    const t = lines[+b.dataset.i]; const el = (lastFocused && panel.contains(lastFocused)) ? lastFocused : $('f_name');
    el.value = el.value.trim() && el.tagName === 'TEXTAREA' ? el.value.trim() + ' ' + t : t;   // 주소는 이어 붙이기
    el.classList.remove('auto'); el.closest('.fld').classList.remove('has-auto');
    el.focus(); toastMsg('입력했어요', 900);
  });
}

/* OCR 엔진 선택 */
async function runOCREngine(dataUrl, onProgress){
  if (HAS_NATIVE_OCR){
    try { return await nativeOCR(dataUrl); } catch(e){ console.warn('기기 OCR 실패 → Tesseract', e); }
  }
  return await tesseractOCR(dataUrl, onProgress);
}
const NATIVE_OCR_WAIT = {};                                                      // 요청 ID → 대기 중 Promise
window.__nativeOcrDone = function(id, r){ const w = NATIVE_OCR_WAIT[id]; if (!w) return; delete NATIVE_OCR_WAIT[id]; r && r.ok ? w.ok(r) : w.fail(new Error((r && r.error) || '기기 OCR 실패')); };
function nativeOCR(dataUrl){
  return new Promise((ok, fail)=>{
    const id = 'o' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    NATIVE_OCR_WAIT[id] = { ok:r=>ok({ text:r.text||'', lines:r.lines||[], engine:'기기 내 한글 OCR' }), fail };
    setTimeout(()=>{ if (NATIVE_OCR_WAIT[id]){ delete NATIVE_OCR_WAIT[id]; fail(new Error('기기 OCR 시간 초과')); } }, 25000);
    try { NATIVE.recognizeText(id, dataUrl); } catch(e){ delete NATIVE_OCR_WAIT[id]; fail(e); }
  });
}
let TESS_WORKER = null, TESS_PROGRESS = null;                                    // Tesseract 워커 재사용
async function tesseractOCR(dataUrl, onProgress){
  if (typeof Tesseract === 'undefined') throw new Error('OCR 엔진을 불러오지 못했어요(오프라인?)');
  TESS_PROGRESS = onProgress;
  if (!TESS_WORKER){
    TESS_WORKER = await Tesseract.createWorker('kor+eng', 1, {
      logger: m => { if (m.status === 'recognizing text' && TESS_PROGRESS) TESS_PROGRESS(m.progress); }
    });
    await TESS_WORKER.setParameters({ tessedit_pageseg_mode:'11', preserve_interword_spaces:'1' }); // 명함처럼 흩어진 글자
  }
  const { data } = await TESS_WORKER.recognize(dataUrl);
  const lines = (data.lines||[]).filter(l=>l.confidence > 30).map(l=>({ text:l.text.trim(), x:l.bbox.x0, y:l.bbox.y0, w:l.bbox.x1-l.bbox.x0, h:l.bbox.y1-l.bbox.y0 }));
  return { text:lines.map(l=>l.text).join('\n') || data.text || '', lines, engine:'무료 OCR' };
}
